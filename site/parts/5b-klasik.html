 {t:'Teori', q:'Muhasebeyi tanımlayınız ve AICPA tanımındaki dört temel işlevi açıklayınız.', k:['Tanım: işletme faaliyetlerini ölçen, işleyen ve karar vericilere ileten bilgi sistemi','Recording (kaydetme)','Classifying (sınıflandırma)','Summarizing (özetleme)','Interpreting (yorumlama)','Parasal / finansal nitelikli işlemler vurgusu'], a:`Muhasebe, bir işletmenin ekonomik faaliyetlerini **ölçen**, bu verileri **raporlara işleyen** ve sonuçları **karar vericilere ileten** bir bilgi sistemidir.
AICPA tanımına göre muhasebe, parasal ve en azından kısmen finansal nitelikli işlemlerin:
1. **Kaydedilmesi (recording):** işlemlerin tarih sırasıyla yevmiyeye yazılması
2. **Sınıflandırılması (classifying):** benzer işlemlerin aynı hesaplarda toplanması
3. **Özetlenmesi (summarizing):** hesapların finansal tablolara dönüştürülmesi
4. **Yorumlanması (interpreting):** sonuçların analiz edilip kullanıcılara anlamlı hâle getirilmesi
sanatıdır. Muhasebe üç soruya cevap verir: işletmenin ne kadar kaynağı var, bu kaynaklar nasıl finanse edildi ve hangi sonuç elde edildi.`},
 {t:'Teori', q:'Finansal muhasebe ile yönetim muhasebesini kullanıcı, kurallar ve ürün açısından karşılaştırınız.', k:['Finansal: dış kullanıcılar (yatırımcı, banka, devlet)','Yönetim: iç kullanıcılar (yöneticiler)','Finansal: ortak standartlar (IFRS/GAAP), karşılaştırılabilir','Yönetim: serbest, ihtiyaca göre','Ürünler: finansal tablolar vs bütçe/maliyet raporu','Yönetim muhasebesinin işlevleri: planning, implementation, control'], a:`| | Finansal muhasebe | Yönetim muhasebesi
| Kullanıcı | Dış kullanıcılar: yatırımcı, kreditör, devlet | İç kullanıcılar: yöneticiler
| Kurallar | Ortak standartlar (IFRS / US GAAP); karşılaştırılabilir olmalı | Zorunlu standart yok; ihtiyaca göre serbest
| Ürün | Bilanço, gelir tablosu, özkaynak ve nakit akış tabloları | Bütçeler, maliyet raporları, performans raporları
| Amaç | İşletmenin genel durumunu dışarıya raporlamak | Planlama, uygulama ve kontrol kararlarını desteklemek
Yönetim muhasebesi yöneticinin üç işlevine hizmet eder: **planning** (bütçe, alternatif seçimi), **implementation** (planı uygulamak) ve **control** (sonuçları izleyip değerlendirmek).`},
 {t:'Teori', q:'Muhasebe bilgisinin iç ve dış kullanıcılarını, bilgiyi ne amaçla kullandıklarıyla birlikte açıklayınız.', k:['İç kullanıcı: yöneticiler; planlama ve kontrol','Yatırımcılar/hissedarlar: risk-getiri, al-tut-sat, temettü','Kreditörler/bankalar: borcun ve faizin ödenme gücü','Devlet: vergi, teşvik, istatistik','Diğer dış kullanıcılar: çalışanlar, tedarikçiler, müşteriler, rakipler'], a:`**İç kullanıcılar:** Yöneticiler. Planlama, strateji belirleme, kaynak dağıtımı ve kontrol için kullanır.
**Dış kullanıcılar:**
- **Yatırımcılar / hissedarlar:** riski ve getiriyi değerlendirir; hisseyi alma, tutma ya da satma kararı verir; temettü ödeme gücüne bakar.
- **Kreditörler / bankalar:** verilen kredinin ve faizin vadesinde ödenip ödenemeyeceğini değerlendirir.
- **Devlet:** vergilendirme, ekonomiyi teşvik politikaları ve ulusal istatistikler için kullanır.
- **Çalışanlar, tedarikçiler, müşteriler, rakipler:** işletmenin sürekliliğini ve finansal gücünü değerlendirir.`},
 {t:'Teori', q:'Sole proprietorship, partnership ve corporation türlerini sahiplik, sorumluluk ve vergilendirme açısından karşılaştırınız.', k:['Sole proprietorship: tek sahip, sınırsız sorumluluk','Partnership: 2+ ortak, sınırsız sorumluluk, kâr anlaşmaya göre','Corporation: hissedarlar, sınırlı sorumluluk','Vergi: ilk ikisinde kâr sahibin/ortakların gelirine eklenir; corporation ayrı vergilenir','Sahiplik devri: corporation\'da hisse kolay devredilir'], a:`| | Sole proprietorship | Partnership | Corporation
| Sahiplik | Tek kişi | İki veya daha fazla ortak | Hissedarlar
| Sorumluluk | Sınırsız, kişisel mal varlığına kadar | Sınırsız; kâr/zarar ortaklık anlaşmasına göre paylaşılır | Sınırlı: hissedar yatırdığı kadar sorumlu
| Vergi | Kâr sahibin kişisel gelirine eklenir | Kâr ortakların gelirine eklenir | Ayrı tüzel kişidir, kendi kârı üzerinden vergilenir
| Sahiplik devri | Zor | Anlaşmaya bağlı | Hisse alınıp satılarak kolayca devredilir
Özkaynak hesaplarında da fark vardır: şahıs işletmesinde **Capital** ve **Withdrawals**, şirkette **Common Stock**, **Retained Earnings** ve **Dividends** kullanılır.`},
 {t:'Döngü', q:'Muhasebe döngüsünün adımlarını sırasıyla yazınız.', k:['Analyze transactions','Journalize','Post to ledger','Trial balance','Adjusting entries','Adjusted trial balance','Financial statements','Closing entries','Post-closing trial balance'], a:`1. **Analyze:** işlemleri analiz et (hangi hesaplar, artış mı azalış mı)
2. **Journalize:** yevmiyeye tarih sırasıyla kaydet
3. **Post:** defteri kebirdeki (ledger) hesaplara aktar
4. **Trial balance:** mizan hazırla (debit toplamı = credit toplamı)
5. **Adjusting entries:** dönem sonu düzeltme kayıtları
6. **Adjusted trial balance:** düzeltilmiş mizan
7. **Financial statements:** finansal tabloları hazırla
8. **Closing entries:** gelir, gider ve temettü hesaplarını kapat
9. **Post-closing trial balance:** kapanış sonrası mizan`},
 {t:'Denklem', q:'Prepaid expense ile unearned revenue arasındaki farkı birer örnek ve yevmiye kaydıyla açıklayınız.', k:['Prepaid expense bir varlıktır','Gider peşin ödenmiş, fayda ileride','Örnek kayıt: Prepaid Rent Dr / Cash Cr','Unearned revenue bir borçtur','Para peşin alınmış, hizmet henüz verilmemiş','Örnek kayıt: Cash Dr / Unearned Revenue Cr'], a:`**Prepaid expense (peşin ödenmiş gider)** bir **varlıktır**. Gider peşin ödenmiştir ama faydası gelecek dönemlerde kullanılacaktır.
Örnek: 1 Aralık'ta 3 aylık kira 3.000 peşin ödendi.
| Hesap | Debit | Credit
| Prepaid Rent | 3.000 |
|    Cash |  | 3.000
**Unearned revenue (kazanılmamış gelir)** bir **borçtur**. Para peşin tahsil edilmiştir ama hizmet henüz verilmemiştir; işletme hizmeti vermek zorundadır.
Örnek: gelecek ayın hizmeti için müşteriden 600 peşin alındı.
| Hesap | Debit | Credit
| Cash | 600 |
|    Unearned Revenue |  | 600
Hizmet verildikçe Unearned Revenue azalır ve gelir kaydedilir; kira dönemi geçtikçe Prepaid Rent azalır ve gider kaydedilir.`},
 {t:'Tablolar', q:'Temettü (dividends) neden bir gider değildir? Hangi finansal tabloda gösterilir?', k:['Temettü sahiplere dağıtımdır, gelir elde etmek için katlanılan maliyet değildir','Özkaynağı azaltır','Gelir tablosunda yer almaz','Özkaynak / retained earnings tablosunda düşülür','Normal bakiyesi debit'], a:`Gider, **gelir elde etmek için katlanılan** maliyettir (kira, maaş, elektrik). Temettü ise kazanılmış kârın **sahiplere dağıtılmasıdır**; gelir elde etmeye katkısı yoktur. Bu yüzden gider değildir.
Temettü özkaynağı azaltır, ama **gelir tablosuna girmez** ve net kârı etkilemez. **Statement of owner's equity / retained earnings** tablosunda dönem başı özkaynağa net kâr eklendikten sonra düşülür:
Dönem sonu RE = Dönem başı RE + Net Income − Dividends
Dividends hesabı borç (debit) tarafında artar ve normal bakiyesi debittir (DEA kuralı).`},
 {t:'Mizan', q:'Mizan (trial balance) dengede ise kayıtlar hatasız mıdır? Açıklayınız.', k:['Mizan sadece debit = credit eşitliğini kontrol eder','Hatasızlığı kanıtlamaz','Yanlış hesaba kayıt (tutar doğru) bozmaz','Hiç kaydedilmemiş işlem bozmaz','İki kez kaydedilen işlem bozmaz','Debit ve credit\'te aynı tutarda yapılan hata bozmaz'], a:`Hayır. Mizan yalnızca **toplam borç bakiyelerinin toplam alacak bakiyelerine eşit** olduğunu gösterir. Eşitlik, kayıtların doğru olduğunu kanıtlamaz. Mizanı bozmayan hatalar:
- Tutarı doğru ama **yanlış hesaba** yapılan kayıt (ör. Supplies yerine Equipment'a borç)
- **Hiç kaydedilmemiş** bir işlem
- **İki kez** kaydedilmiş bir işlem
- Borç ve alacakta **aynı tutarda** yanlış yazılmış kayıt (ör. 500 yerine iki tarafta da 50)
Mizanın dengede olmaması ise kesin olarak bir hata olduğunu gösterir.`},
 {t:'Tablolar', q:'Finansal tabloları hazırlanma sırasıyla yazınız ve neden bu sırayla hazırlandıklarını açıklayınız.', k:['1. Income statement','2. Statement of owner\'s equity','3. Balance sheet','(4. Statement of cash flows)','Net income → özkaynak tablosuna taşınır','Dönem sonu özkaynak → bilançoya taşınır','Üç satırlık başlık'], a:`1. **Income statement:** gelirler − giderler = net kâr/zarar (bir dönem için)
2. **Statement of owner's equity:** dönem başı özkaynak + yatırım + **net kâr** − temettü = dönem sonu özkaynak
3. **Balance sheet:** varlıklar = borçlar + **dönem sonu özkaynak** (belirli bir tarih için)
4. Statement of cash flows: nakit giriş ve çıkışları
Sıra zorunludur, çünkü her tablo bir sonrakini besler: gelir tablosunun sonucu (net kâr) özkaynak tablosuna, özkaynak tablosunun son satırı bilançoya taşınır. Her tablonun üç satırlık başlığı olur: şirket adı, tablonun adı, dönem/tarih.`},
 {t:'Tablolar', q:'Cari (current) ve uzun vadeli (non-current) varlık ve borçları tanımlayıp her birine iki örnek veriniz.', k:['Cari varlık: 1 yıl/faaliyet döngüsü içinde nakde dönen veya kullanılan','Örnek: Cash, A/R, Inventory, Supplies, Prepaid','Uzun vadeli varlık: PP&E, maddi olmayan duran varlık, uzun vadeli yatırım','Cari borç: 1 yıl içinde ödenecek','Örnek: A/P, Salaries Payable, Unearned Revenue','Uzun vadeli borç: long-term notes, mortgage payable'], a:`**Cari varlıklar:** bir yıl (veya faaliyet döngüsü, hangisi uzunsa) içinde nakde dönmesi ya da kullanılması beklenen varlıklar. Örnek: Cash, Accounts Receivable, Inventory, Supplies, Prepaid Rent.
**Uzun vadeli varlıklar:** bir yıldan uzun süre kullanılacak varlıklar. Örnek: Land, Building, Equipment (PP&E), maddi olmayan duran varlıklar, uzun vadeli yatırımlar.
**Cari borçlar:** bir yıl içinde ödenecek borçlar. Örnek: Accounts Payable, Salaries Payable, Taxes Payable, Unearned Revenue, kısa vadeli krediler.
**Uzun vadeli borçlar:** vadesi bir yıldan uzun borçlar. Örnek: long-term Notes Payable, Mortgage Payable.`},
 {t:'Denklem', p:1, ek:1, q:`**Ece Design** Ekim ayında kuruldu. İşlemleri muhasebe denklemi tablosunda gösteriniz (Cash, A/R, Supplies, Equipment = A/P + Capital).

 {t:'Tablolar', p:1, ek:1, q:'Bir önceki sorudaki **Ece Design** verilerinden Ekim ayı için gelir tablosu, özkaynak değişim tablosu ve bilançoyu hazırlayınız.', k:['Üç satırlık başlık','Revenue 6.500 (4.500 + 2.000)','Expenses 2.500 (Rent 1.500 + Salaries 1.000)','Net income 4.000','Capital sonu = 25.000 + 4.000 − 900 = 28.100','Bilanço: varlıklar 28.600 = A/P 500 + Capital 28.100','Çekiş gelir tablosunda yok'], a:`**Ece Design — Income Statement — For the Month Ended October 31**

 {t:'T-hesap', p:1, ek:1, q:'Cash hesabının açılış bakiyesi 2.000 (Dr). Ay içinde: 3 Kasım 5.000 nakit hizmet geliri, 10 Kasım 1.200 kira ödemesi, 15 Kasım 800 maaş ödemesi, 20 Kasım müşteriden 600 tahsilat. Cash T-hesabını çizip bakiyesini bulunuz.', k:['Açılış 2.000 debit tarafında','Girişler (5.000, 600) debit','Çıkışlar (1.200, 800) credit','Debit toplamı 7.600, credit toplamı 2.000','Bakiye 5.600 Dr (büyük tarafa yazılır)'], a:`| Debit (+) | | Credit (−) |
| Açılış | 2.000 | 10 Kasım | 1.200

| 20 Kasım | 600 | |
| **Toplam** | **7.600** | **Toplam** | **2.000**

Bakiye = büyük taraf − küçük taraf = 7.600 − 2.000 = **5.600 debit**. Cash bir varlık olduğu için normal bakiyesi zaten debittir.`},
 {t:'Mizan', p:1, ek:1, q:'Aşağıdaki bakiyelerden 30 Kasım tarihli mizanı hazırlayınız ve net kârı bulunuz: Cash 9.000; Accounts Receivable 3.000; Supplies 600; Equipment 15.000; Accounts Payable 1.600; Notes Payable 8.000; Unearned Revenue 1.000; Common Stock 15.000; Dividends 1.200; Service Revenue 7.500; Salaries Expense 3.200; Rent Expense 900; Utilities Expense 200.', k:['Varlıklar, Dividends ve giderler debit sütununda','Borçlar, Common Stock ve Revenue credit sütununda','Toplamlar 33.100 = 33.100','Net income = 7.500 − 4.300 = 3.200','Temettü net kârı etkilemez'], a:`| Hesap | Debit | Credit

 {t:'Borç/Alacak', p:1, ek:1, q:'Aşağıdaki hesapların türünü (A, L, OE, R, E, D), artış tarafını ve normal bakiyesini yazınız: Accounts Receivable, Unearned Revenue, Rent Expense, Common Stock, Prepaid Insurance, Dividends, Salaries Payable, Service Revenue.', k:['Accounts Receivable: Asset, Dr, Dr','Unearned Revenue: Liability, Cr, Cr','Rent Expense: Expense, Dr, Dr','Common Stock: OE, Cr, Cr','Prepaid Insurance: Asset, Dr, Dr','Dividends: D, Dr, Dr','Salaries Payable: Liability, Cr, Cr','Service Revenue: Revenue, Cr, Cr'], a:`| Hesap | Tür | Artış | Normal bakiye

 {t:'Denklem', p:1, ek:1, q:'Yıl başında bir işletmenin varlıkları 50.000, borçları 20.000\'dir. Yıl içinde borçlar 5.000 artmış, sahip 3.000 ek yatırım yapmış ve 2.000 temettü dağıtılmıştır. Yıl sonu varlıklar 64.000 ise yılın net kârı ne kadardır?', k:['Başlangıç OE = 50.000 − 20.000 = 30.000','Yıl sonu borçlar = 25.000','Yıl sonu OE = 64.000 − 25.000 = 39.000','Sonu OE = başı + yatırım + NI − temettü','NI = 39.000 − 30.000 − 3.000 + 2.000 = 8.000'], a:`1. Yıl başı özkaynak: 50.000 − 20.000 = **30.000**
2. Yıl sonu borçlar: 20.000 + 5.000 = **25.000**
3. Yıl sonu özkaynak: 64.000 − 25.000 = **39.000**
4. Özkaynak değişimi: Sonu = Başı + Yatırım + Net Income − Temettü
39.000 = 30.000 + 3.000 + NI − 2.000 → **NI = 8.000**`},
 {t:'3 Kasım örneği', q:'Smart Touch Learning örneğinde 22 Kasım\'daki 2.000 tahsilat ve 21 Aralık\'taki 600 peşin tahsilat neden gelir olarak kaydedilmez? Doğru kayıtları yazınız.', k:['22 Kasım: gelir 10 Kasım\'da hizmet verilince kaydedildi','Tahsilat sadece A/R → Cash varlık değişimi','Kayıt: Cash Dr 2.000 / A/R Cr 2.000','21 Aralık: hizmet henüz verilmedi, gelir kazanılmadı','Kayıt: Cash Dr 600 / Unearned Revenue Cr 600 (borç)'], a:`**22 Kasım (2.000 tahsilat):** Gelir, hizmetin verildiği **10 Kasım'da** kaydedildi (A/R Dr / Service Revenue Cr). Tahsilatta yeni bir gelir yoktur; sadece bir varlık (A/R) başka bir varlığa (Cash) dönüşür.

KL.math = [
 {t:'Bölüm 3 · Doğrular', p:1, ek:1, q:'Bir ürünün fiyatı 40 TL iken talep 100 birim, fiyat 30 TL iken talep 150 birimdir. Talebin doğrusal olduğunu varsayarak talep denklemini p = mq + b biçiminde bulunuz.', k:['Noktalar (q, p): (100, 40) ve (150, 30)','Eğim m = (30 − 40)/(150 − 100) = −0,2','Nokta-eğim: p − 40 = −0,2(q − 100)','p = −0,2q + 60','Eğimin negatif olması talep yasasına uygun'], a:`Noktaları (q, p) olarak yaz: (100, 40) ve (150, 30).
1. Eğim: m = (30 − 40) / (150 − 100) = −10 / 50 = **−0,2**
2. Nokta-eğim formu: p − 40 = −0,2(q − 100)
3. p = −0,2q + 20 + 40 → **p = −0,2q + 60**
Kontrol: q = 150 → p = −30 + 60 = 30 ✓. Eğim negatif: fiyat artınca talep düşer (talep doğrusu).`},
 {t:'Bölüm 3 · Sistemler', p:1, ek:1, q:'Talep p = 120 − 3q, arz p = 30 + 2q\'dur. (a) Piyasa dengesini bulunuz. (b) Birim başına 10 TL vergi konursa yeni denge ne olur? Verginin ne kadarı tüketiciye yansır?', k:['Denge: 120 − 3q = 30 + 2q','q = 18, p = 66','Vergi: yeni arz p = 40 + 2q','120 − 3q = 40 + 2q → q = 16, p = 72','Fiyat 6 TL arttı: verginin 6 TL\'si tüketiciye, 4 TL\'si üreticiye'], a:`**(a)** Arz = talep: 120 − 3q = 30 + 2q → 90 = 5q → **q = 18**, p = 120 − 54 = **66**
**(b)** Vergi arzı yukarı kaydırır: yeni arz p = (30 + 2q) + 10 = 40 + 2q
120 − 3q = 40 + 2q → 80 = 5q → **q = 16**, p = 120 − 48 = **72**
Fiyat 66'dan 72'ye çıktı: 10 TL'lik verginin **6 TL'si tüketiciye** yansıdı, kalan 4 TL'yi üretici üstlendi (üreticinin eline geçen 72 − 10 = 62). Miktar 18'den 16'ya düştü.`},
 {t:'Bölüm 1 · Uygulamalar', p:1, ek:1, q:'Bir firmanın sabit maliyeti 12.000 TL, birim değişken maliyeti 30 TL, satış fiyatı 50 TL\'dir. (a) Başabaş miktarını bulunuz. (b) En az 6.000 TL kâr için kaç birim satılmalıdır?', k:['TR = 50q, TC = 12.000 + 30q','Başabaş: TR = TC → q = 600','Kâr = 20q − 12.000','20q − 12.000 ≥ 6.000','q ≥ 900 (eşitsizlik olarak yazılmalı)'], a:`TR = 50q, TC = 12.000 + 30q, Kâr = TR − TC = 20q − 12.000
**(a)** Başabaş: 50q = 12.000 + 30q → 20q = 12.000 → **q = 600 birim**
**(b)** 20q − 12.000 ≥ 6.000 → 20q ≥ 18.000 → **q ≥ 900 birim**
Sonuç: en az 900 birim satılmalı. Cevabı eşitsizlik olarak yazmak gerekir.`},
 {t:'Bölüm 3 · Parabol', p:1, ek:1, q:'Talep fonksiyonu p = 200 − 4q\'dur. Toplam geliri maksimum yapan miktarı, fiyatı ve maksimum geliri bulunuz.', k:['R = p·q = 200q − 4q²','a = −4 < 0: parabol aşağı açık, tepe maksimum','q = −b/2a = −200/(−8) = 25','p = 200 − 100 = 100','R = 2.500'], a:`1. Gelir: R(q) = p·q = (200 − 4q)q = **200q − 4q²**
2. a = −4 < 0 olduğu için parabol aşağı açıktır; tepe noktası **maksimumdur**.
3. q = −b / 2a = −200 / (2·(−4)) = **25**
4. p = 200 − 4·25 = **100**
5. R = 100 · 25 = **2.500**`},
 {t:'Bölüm 1 · Eşitsizlik', p:1, ek:1, q:'(a) 3(2x − 1) − 5 > 4x + 6 eşitsizliğini çözünüz. (b) |2x − 5| ≤ 7 eşitsizliğini çözünüz. Cevapları aralık olarak yazınız.', k:['(a) 6x − 8 > 4x + 6','2x > 14 → x > 7 → (7, ∞)','(b) −7 ≤ 2x − 5 ≤ 7','−2 ≤ 2x ≤ 12 → −1 ≤ x ≤ 6','Kapalı aralık [−1, 6]'], a:`**(a)** 6x − 3 − 5 > 4x + 6 → 6x − 8 > 4x + 6 → 2x > 14 → **x > 7**, yani **(7, ∞)**
**(b)** |u| ≤ a ⇔ −a ≤ u ≤ a:
−7 ≤ 2x − 5 ≤ 7 → −2 ≤ 2x ≤ 12 → **−1 ≤ x ≤ 6**, yani **[−1, 6]**
Not: negatif sayıyla çarpma ya da bölme olsaydı eşitsizlik yön değiştirirdi.`},
 {t:'Bölüm 2 · Fonksiyonlar', p:1, ek:1, q:'f(x) = √(x − 2) ve g(x) = x² + 1 veriliyor. (f∘g)(x) ve (g∘f)(x)\'i bulup her birinin tanım kümesini yazınız.', k:['(f∘g)(x) = f(g(x)) = √(x² − 1)','Tanım: x² − 1 ≥ 0 → x ≤ −1 veya x ≥ 1','(g∘f)(x) = g(f(x)) = (√(x − 2))² + 1 = x − 1','Tanım: f\'nin tanımından x ≥ 2','f∘g ≠ g∘f'], a:`**(f∘g)(x) = f(g(x))** = √(x² + 1 − 2) = **√(x² − 1)**
Kök içi ≥ 0: x² ≥ 1 → **x ≤ −1 veya x ≥ 1**, yani (−∞, −1] ∪ [1, ∞)
**(g∘f)(x) = g(f(x))** = (√(x − 2))² + 1 = **x − 1**
Sadeleşmiş hâli her x için tanımlı gibi görünse de önce f(x) hesaplanmalı: **x ≥ 2**
Görüldüğü gibi f∘g ≠ g∘f.`},
 {t:'Bölüm 2 · Ters fonksiyon', p:1, ek:1, q:'f(x) = (3x + 2) / 5 fonksiyonunun tersini bulunuz ve f(f⁻¹(x)) = x olduğunu gösteriniz.', k:['y = (3x + 2)/5 yaz','x ile y yer değiştirir: x = (3y + 2)/5','5x = 3y + 2 → y = (5x − 2)/3','f⁻¹(x) = (5x − 2)/3','Kontrol: f(f⁻¹(x)) = x'], a:`1. y = (3x + 2) / 5
2. x ile y yer değiştir: x = (3y + 2) / 5
3. y'yi yalnız bırak: 5x = 3y + 2 → **y = (5x − 2) / 3**, yani **f⁻¹(x) = (5x − 2)/3**
Kontrol: f(f⁻¹(x)) = (3·(5x − 2)/3 + 2) / 5 = (5x − 2 + 2) / 5 = x ✓`},
 {t:'Bölüm 4 · Logaritma', p:1, ek:1, q:'log₂x + log₂(x − 2) = 3 denklemini çözünüz.', k:['Çarpım kuralı: log₂[x(x − 2)] = 3','Üstel forma: x(x − 2) = 2³ = 8','x² − 2x − 8 = 0 → (x − 4)(x + 2) = 0','x = −2 geçersiz (log içi negatif)','Cevap x = 4'], a:`1. Logları birleştir: log₂[x(x − 2)] = 3
2. Üstel forma çevir: x(x − 2) = 2³ = 8
3. x² − 2x − 8 = 0 → (x − 4)(x + 2) = 0 → x = 4 veya x = −2
4. Kontrol: x = −2 için log₂(−2) tanımsız → **geçersiz**
**Cevap: x = 4** (log₂4 + log₂2 = 2 + 1 = 3 ✓)`},
 {t:'Bölüm 4 · Üstel', p:1, ek:1, q:'500 TL yıllık %4 sürekli bileşik faizle kaç yılda 800 TL olur?', k:['800 = 500e^(0,04t)','e^(0,04t) = 1,6','ln alınır: 0,04t = ln 1,6','t = ln 1,6 / 0,04','t ≈ 11,75 yıl'], a:`1. S = Pe^(rt): 800 = 500 · e^(0,04t)
2. e^(0,04t) = 1,6
3. İki tarafın ln'i: 0,04t = ln 1,6 ≈ 0,4700
4. t = 0,4700 / 0,04 ≈ **11,75 yıl**`},
 {t:'Bölüm 1 · Σ ve diziler', p:1, ek:1, q:'(a) Σ (i = 1\'den 10\'a) (3i + 2) toplamını bulunuz. (b) 2, 6, 18, … geometrik dizisinin ilk 6 teriminin toplamını bulunuz.', k:['(a) Σ(3i + 2) = 3Σi + Σ2','Σi = 10·11/2 = 55; Σ2 = 20','Sonuç 165 + 20 = 185','(b) a₁ = 2, r = 3, n = 6','S₆ = 2(1 − 3⁶)/(1 − 3) = 728'], a:`**(a)** Toplamı ayır, sabiti dışarı çıkar: Σ(3i + 2) = 3Σi + Σ2
Σi = n(n + 1)/2 = 10·11/2 = 55; Σ2 = 10·2 = 20
Sonuç: 3·55 + 20 = **185**
**(b)** a₁ = 2, r = 6/2 = 3, n = 6
S₆ = a₁(1 − rⁿ)/(1 − r) = 2(1 − 729)/(1 − 3) = 2·(−728)/(−2) = **728**`},
 {t:'Bölüm 5 · Bileşik faiz', p:1, ek:1, q:'8.000 TL yıllık %9 aylık bileşik faizle 4 yıl yatırılıyor. (a) Birikimi ve kazanılan faizi bulunuz. (b) Efektif yıllık oranı bulunuz.', k:['r = 0,09/12 = 0,0075; n = 48','S = 8.000(1,0075)⁴⁸','S ≈ 11.451,24','Faiz ≈ 3.451,24','rₑ = (1,0075)¹² − 1 ≈ %9,38'], a:`r = 0,09 / 12 = **0,0075**, n = 4 · 12 = **48**
**(a)** S = P(1 + r)ⁿ = 8.000 · (1,0075)⁴⁸ ≈ **11.451,24 TL**
Bileşik faiz = S − P ≈ 11.451,24 − 8.000 = **3.451,24 TL**
**(b)** rₑ = (1 + r)^m − 1 = (1,0075)¹² − 1 ≈ 0,0938 → **%9,38**
Efektif oran nominal orandan büyüktür, çünkü faiz yıl içinde 12 kez anaparaya eklenir.`},
 {t:'Bölüm 5 · Değer denklemi', p:1, ek:1, q:'Bir kişinin 2. yıl sonunda 3.000 TL ve 5. yıl sonunda 5.000 TL borcu vardır. Bu iki borç 3. yıl sonunda yapılacak tek bir ödemeyle kapatılacaktır. Yıllık %6 yıllık bileşik faizle bu ödemeyi bulunuz.', k:['Zaman çizelgesi; karşılaştırma tarihi 3. yıl','3.000 bir yıl ileri taşınır: 3.000(1,06)','5.000 iki yıl geri taşınır: 5.000(1,06)⁻²','X = 3.180 + 4.449,98','X ≈ 7.629,98'], a:`Karşılaştırma tarihi: **3. yıl** (bilinmeyen ödemenin tarihi).
- 2. yıldaki 3.000 bir yıl **ileri** taşınır: 3.000 · (1,06)¹ = 3.180,00
- 5. yıldaki 5.000 iki yıl **geri** taşınır: 5.000 · (1,06)⁻² ≈ 4.449,98
Borçlar = ödemeler: X = 3.180,00 + 4.449,98 ≈ **7.629,98 TL**
İpucu: zaman çizelgesini mutlaka çiz; her tutarın kaç dönem ve hangi yöne taşındığını yaz.`},
 {t:'Bölüm 5 · Amortisman', p:1, ek:1, q:'10.000 TL kredi, yıllık %12 aylık bileşik faizle 12 eşit aylık taksitle ödenecektir. (a) Taksiti bulunuz. (b) Amortisman tablosunun ilk iki satırını yazınız. (c) Toplam faizi bulunuz.', k:['r = 0,01, n = 12','R = 10.000 / a(12; 0,01) ≈ 888,49','1. ay: faiz 100,00; anapara 788,49; bakiye 9.211,51','2. ay: faiz 92,12; anapara 796,37; bakiye 8.415,14','Toplam faiz = 12R − A ≈ 661,85'], a:`r = 0,12 / 12 = **0,01**, n = **12**
**(a)** R = A / a(n, r) = 10.000 · 0,01 / [1 − (1,01)⁻¹²] ≈ **888,49 TL**
**(b)**
| Ay | Taksit | Faiz (bakiye × r) | Anapara (R − faiz) | Kalan bakiye
| 0 |  |  |  | 10.000,00
| 1 | 888,49 | 100,00 | 788,49 | 9.211,51
| 2 | 888,49 | 92,12 | 796,37 | 8.415,14
**(c)** Toplam faiz = nR − A = 12 · 888,49 − 10.000 ≈ **661,85 TL**
Faiz payı her ay azalır, anapara payı artar.`},
 {t:'Bölüm 5 · Annüiteler', p:1, ek:1, q:'(a) 10 yıl sonra 50.000 TL birikim için yıllık %4 faizle her yıl sonunda ne kadar yatırılmalıdır? (b) Her yıl başında 2.000 TL, 10 yıl boyunca %6 faizle yatırılırsa 10. yıl sonunda birikim ne olur?', k:['(a) Sinking fund: R = S / s(n, r)','R = 50.000 / s(10; 0,04) ≈ 4.164,55','(b) Annuity due gelecek değeri','S = R(s(n + 1, r) − 1) = 2.000(s(11; 0,06) − 1)','S ≈ 27.943,29'], a:`**(a) Sinking fund** (dönem sonu ödeme): R = S / s(n, r)
s(10; 0,04) = (1,04¹⁰ − 1) / 0,04 ≈ 12,0061
R = 50.000 / 12,0061 ≈ **4.164,55 TL**
**(b) Annuity due** (dönem başı ödeme): S = R · (s(n + 1, r) − 1)
s(11; 0,06) = (1,06¹¹ − 1) / 0,06 ≈ 14,9716
S = 2.000 · (14,9716 − 1) ≈ **27.943,29 TL**
Ödemeler dönem başında olduğu için her ödeme bir dönem fazla faiz kazanır.`},
 {t:'Bölüm 5 · Annüiteler', p:1, ek:1, q:'Bir yatırım, 4. yılın sonundan başlayarak 5 yıl boyunca her yıl sonunda 1.000 TL ödeyecektir. Yıllık %5 faizle bu ödemelerin bugünkü değerini bulunuz.', k:['Ertelenmiş annüite: ilk ödeme 4. yıl sonu','Annüite önce 3. yıla değerlenir: 1.000·a(5; 0,05)','a(5; 0,05) ≈ 4,3295 → 4.329,48','Sonra bugüne indirilir: × (1,05)⁻³','BD ≈ 3.739,96'], a:`Ödemeler 4, 5, 6, 7 ve 8. yıl sonlarında: bir **ertelenmiş annüite**.
1. Annüiteyi ilk ödemeden bir dönem önceye, yani **3. yıla** değerle:
1.000 · a(5; 0,05) = 1.000 · [1 − 1,05⁻⁵] / 0,05 ≈ **4.329,48**
2. Bu tutarı 3 yıl geri, bugüne indir:
4.329,48 · (1,05)⁻³ ≈ **3.739,96 TL**`},
 {t:'Bölüm 5 · Sürekli ve sonsuz', p:1, ek:1, q:'(a) 8 yıl sonra 20.000 TL elde etmek için yıllık %6 sürekli bileşik faizle bugün ne yatırılmalıdır? (b) Her yıl 4.000 TL burs ödeyecek kalıcı bir fon için %5 faizle bugün ne yatırılmalıdır?', k:['(a) P = Se^(−rt)','P = 20.000e^(−0,48)','P ≈ 12.375,67','(b) Perpetuity: A = R / r','A = 4.000 / 0,05 = 80.000'], a:`**(a)** Sürekli bileşikte P = S · e^(−rt), r yıllık kalır:
P = 20.000 · e^(−0,06·8) = 20.000 · e^(−0,48) ≈ **12.375,67 TL**
**(b)** Ödemeler sonsuza kadar sürdüğü için perpetuity: A = R / r
A = 4.000 / 0,05 = **80.000 TL**
Fon yalnızca faizini dağıtır; anapara hiç azalmaz.`}
];

KL.law = [
 {t:'Sosyal düzen kuralları', q:'Sosyal düzen kurallarını kaynak ve yaptırım bakımından karşılaştırınız. Hukuk kuralını diğerlerinden ayıran özellik nedir?', k:['Dört tür: din, ahlak, görgü, hukuk','Din: ilahi irade; uhrevi yaptırım','Ahlak: vicdan; vicdan azabı, kınama','Görgü: gelenek; ayıplanma, dışlanma','Hukuk: devlet; maddi yaptırım, devlet zoruyla uygulanır','Ayırıcı özellik: devlet gücüyle desteklenen maddi yaptırım','Kurallar örtüşebilir (öldürmeme)'], a:`| Kural | Kaynağı | Yaptırımı
| Din | İlahi irade | Uhrevi (öbür dünyada) + toplumsal dışlanma
| Ahlak | Vicdan, toplumun iyi-kötü anlayışı | Vicdan azabı, toplumun kınaması
| Görgü | Toplumsal gelenek | Ayıplanma, dışlanma
| Hukuk | Devlet (yetkili organlar) | Maddi; devlet zoruyla uygulanır
Hukuk kuralını diğerlerinden ayıran özellik **devlet gücüyle desteklenen maddi yaptırımdır**. Diğer kuralların yaptırımı manevi ya da toplumsaldır; hukuk kuralına uyulmazsa devlet ceza, cebri icra, tazminat veya hükümsüzlük yoluyla zorla uygulatır.
Bu kurallar örtüşebilir: “öldürmemek” hem din, hem ahlak, hem hukuk kuralıdır.`},
 {t:'Sosyal düzen kuralları', q:'Hukuk kuralının özelliklerini ve yapısal unsurlarını açıklayınız.', k:['Genel: herkese yönelik','Soyut: benzer tüm olayları düzenler','Sürekli: kaldırılana kadar geçerli','Yaptırıma bağlı','Bağlayıcı: kişinin isteğine bırakılmamış','Yapı: varsayım + hüküm, örnekle'], a:`**Özellikleri:**
- **Genel:** belli bir kişiye değil, herkese yöneliktir.
- **Soyut:** belli bir olayı değil, benzer tüm olayları düzenler.
- **Sürekli:** yürürlükten kaldırılana kadar geçerlidir.
- **Yaptırıma bağlı:** uyulmazsa devlet zorla uygulatır.
- **Bağlayıcı:** uyup uymamak kişinin isteğine bırakılmamıştır.
**Yapısı:** Hukuk kuralı iki parçadan oluşur. **Varsayım** kuralın uygulanacağı durumu, **hüküm** ise bağlanan sonucu belirtir. Örnek: “Bir kimse başkasına haksız olarak zarar verirse (varsayım), bu zararı tazmin etmekle yükümlüdür (hüküm).”`},
 {t:'Sosyal düzen kuralları', ek:1, q:'Objektif hukuk, sübjektif hukuk, pozitif hukuk ve tabii hukuk kavramlarını örnekle açıklayınız.', k:['Objektif hukuk: yürürlükteki kuralların bütünü (Türk hukuku)','Sübjektif hukuk: hukukun kişiye tanıdığı yetki, hak (mülkiyet hakkı)','Pozitif hukuk: belli ülkede belli zamanda yürürlükteki hukuk','Tabii hukuk: insan doğasından gelen ideal, evrensel hukuk','Objektif hukuk hakları doğurur; ilişki kurulması'], a:`- **Objektif hukuk:** bir ülkede yürürlükte olan hukuk kurallarının bütünüdür. Örnek: Türk hukuku, Türk Medeni Kanunu.
- **Sübjektif hukuk (hak):** objektif hukukun kişiye tanıdığı yetkidir. Örnek: mülkiyet hakkı, alacak hakkı.
- **Pozitif hukuk:** belli bir ülkede belli bir zamanda fiilen yürürlükte olan hukuktur. Örnek: bugün Türkiye'de yürürlükteki kanunlar.
- **Tabii (doğal) hukuk:** insan doğasından ve akıldan doğan, her yerde ve her zaman geçerli kabul edilen ideal hukuktur; pozitif hukukun olması gerekeni gösterir.
Objektif hukuk kuralları, kişilere sübjektif haklar tanır.`},
 {t:'Hukuk sistemleri', q:'Kıta Avrupası ve Anglo-Sakson hukuk sistemlerini karşılaştırınız. Türkiye hangi sisteme dahildir?', k:['Kıta Avrupası: asıl kaynak yazılı kanun','Roma hukukuna dayanır, kodifikasyon güçlü','Yargı kararları yardımcı kaynak','Anglo-Sakson: asıl kaynak yargı kararları (içtihat)','Emsal (precedent) ilkesi: önceki karar bağlar','Örnek ülkeler; Türkiye Kıta Avrupası'], a:`| | Kıta Avrupası (Civil Law) | Anglo-Sakson (Common Law)
| Asıl kaynak | Yazılı kanunlar | Yargı kararları (içtihat)
| Temeli | Roma hukuku, güçlü kodifikasyon | Mahkeme kararlarıyla gelişen örf
| Yargı kararları | Yardımcı kaynak | Emsal (precedent): önceki karar benzer davaları bağlar
| Örnek ülkeler | Almanya, Fransa, İsviçre, İtalya, Türkiye | İngiltere, ABD, Kanada, Avustralya
Türkiye **Kıta Avrupası** sistemindedir; Cumhuriyetin ilk yıllarında İsviçre, İtalya ve Almanya'dan kanunlar alınmıştır.`},
 {t:'Hukuk sistemleri', ek:1, q:'Resepsiyon (iktibas) kavramını açıklayınız ve Türkiye\'nin Cumhuriyetin ilk yıllarında aldığı kanunları kaynak ülkeleriyle yazınız.', k:['Resepsiyon: bir ülkenin başka ülkenin hukukunu benimsemesi','Amaç: laik, çağdaş hukuk düzeni','Medeni Kanun ve Borçlar Kanunu (1926): İsviçre','İcra ve İflas Kanunu: İsviçre','Ceza Kanunu (1926): İtalya','Ticaret Kanunu ve Ceza Muhakemesi Kanunu: Almanya'], a:`**Resepsiyon (iktibas)**, bir ülkenin başka bir ülkenin hukuk kurallarını veya kanunlarını benimseyip kendi hukukuna almasıdır. Türkiye, Cumhuriyetin ilk yıllarında laik ve çağdaş bir hukuk düzeni kurmak için Avrupa kanunlarını almıştır:
| Kanun | Alındığı ülke
| Medeni Kanun (1926) | İsviçre
| Borçlar Kanunu (1926) | İsviçre
| İcra ve İflas Kanunu | İsviçre
| Ceza Kanunu (1926) | İtalya
| Ticaret Kanunu | Almanya
| Ceza Muhakemesi Kanunu | Almanya
Bu kanunlar 2000'li yıllarda yenilenmiş (TMK 2001, TCK 2004, TBK ve TTK 2011), ama sistem aynı kalmıştır.`},
 {t:'Hukukun kaynakları', q:'TMK m.1\'e göre hâkimin bir uyuşmazlığı çözerken izleyeceği sırayı açıklayınız.', k:['Önce kanun: sözüyle ve özüyle','Kanunda hüküm yoksa örf ve adet hukuku','O da yoksa hâkim kanun koyucu gibi kural koyar','Bilimsel görüş ve yargı kararlarından yararlanır','Yardımcı kaynaklar kural olarak bağlamaz'], a:`1. **Kanun:** hâkim önce kanunu, sözüyle (lafzıyla) ve özüyle (amacıyla) değindiği bütün konularda uygular.
2. **Örf ve adet hukuku:** kanunda uygulanabilir hüküm yoksa örf ve adet hukukuna göre karar verir.
3. **Hâkimin hukuk yaratması:** örf ve adet de yoksa, kanun koyucu olsaydı koyacağı kurala göre karar verir.
4. Bu süreçte **bilimsel görüşlerden (doktrin) ve yargı kararlarından (içtihat)** yararlanır; bunlar yardımcı kaynaktır ve kural olarak hâkimi bağlamaz.`},
 {t:'Hukukun kaynakları', q:'Normlar hiyerarşisini açıklayınız. Normların üst normlara uygunluğu nasıl denetlenir?', k:['Anayasa en üstte (AY m.11)','Kanunlar ve uluslararası antlaşmalar','Temel haklara ilişkin antlaşma kanunla çatışırsa antlaşma (AY m.90)','CBK; kanunla çatışırsa kanun uygulanır','Yönetmelikler, sonra adsız düzenleyici işlemler','Alt norm üst norma aykırı olamaz','Kanun → Anayasa Mahkemesi; yönetmelik → Danıştay'], a:`Normlar yukarıdan aşağıya:
1. **Anayasa:** en üst norm; tüm kurallar ona uygun olmak zorundadır (AY m.11).
2. **Kanunlar** ve usulüne göre yürürlüğe konmuş **uluslararası antlaşmalar** (kanun hükmündedir). Temel hak ve özgürlüklere ilişkin antlaşma ile kanun çatışırsa **antlaşma** uygulanır (AY m.90).
3. **Cumhurbaşkanlığı kararnameleri:** kanunla çatışırsa **kanun** uygulanır.
4. **Yönetmelikler**
5. **Adsız düzenleyici işlemler** (genelge, tebliğ)
Temel kural: **alt norm üst norma aykırı olamaz.** Kanunların Anayasaya uygunluğunu **Anayasa Mahkemesi**, yönetmeliklerin kanuna uygunluğunu **Danıştay** (idari yargı) denetler.`},
 {t:'Hukukun kaynakları', ek:1, q:'Hukukun asıl ve yardımcı kaynaklarını açıklayınız. Yargı kararları hangi durumlarda bağlayıcıdır?', k:['Asıl yazılı kaynaklar: Anayasa, kanun, antlaşma, CBK, yönetmelik','Asıl yazısız kaynak: örf ve adet','Yardımcı kaynaklar: içtihat ve doktrin','Yardımcı kaynaklar kural olarak bağlamaz','İstisna: AYM kararları','İstisna: Yargıtay içtihadı birleştirme kararları'], a:`**Asıl (bağlayıcı) kaynaklar:**
- Yazılı: Anayasa, kanunlar, uluslararası antlaşmalar, Cumhurbaşkanlığı kararnameleri, yönetmelikler
- Yazısız: örf ve adet hukuku
**Yardımcı kaynaklar:** yargı kararları (içtihat) ve bilimsel görüşler (doktrin). Hâkim bunlardan yararlanır, ama kural olarak bunlarla bağlı değildir.
**İstisna:** **Anayasa Mahkemesi kararları** ve **Yargıtay içtihadı birleştirme kararları** bağlayıcıdır.`},
 {t:'Hukukun kaynakları', q:'Örf ve adet hukukunun unsurlarını açıklayınız. Her alışkanlık örf ve adet hukuku mudur?', k:['Maddi unsur: uzun süre, sürekli ve düzenli tekrar','Manevi unsur: toplumun uymayı hukuken zorunlu sayması','İki unsur birlikte gerekir','Manevi unsur yoksa alışkanlık / görgü kuralı','Yazısız asıl kaynak; TMK m.1\'de kanundan sonra'], a:`Örf ve adet hukukunun iki unsuru vardır:
- **Maddi unsur:** bir davranışın uzun süre, sürekli ve düzenli olarak tekrarlanması.
- **Manevi unsur:** toplumun bu davranışa uymayı **hukuken zorunlu** sayması.
İki unsur birlikte bulunmalıdır. Sadece tekrarlanan ama hukuken zorunlu sayılmayan davranış (manevi unsur yoksa) örf ve adet hukuku değil, **alışkanlık veya görgü kuralıdır**.
Örf ve adet hukuku yazısız asıl kaynaktır ve TMK m.1'e göre kanunda hüküm bulunmayan hâllerde uygulanır.`},
 {t:'Kural türleri', ek:1, q:'Emredici, tamamlayıcı, yorumlayıcı ve tanımlayıcı hukuk kurallarını birer örnekle açıklayınız.', k:['Emredici: kamu düzeni/ahlak/zayıfı korur, aksi kararlaştırılamaz','Emrediciye aykırılık kesin hükümsüzlük; örnek evlenme yaşı','Tamamlayıcı: düzenlenmeyen konuyu doldurur, aksi kararlaştırılabilir (ifa yeri)','Yorumlayıcı: belirsiz ifadeyi açıklar (“ay başı” = 1. gün)','Tanımlayıcı: kavram tanımlar (ergin = 18 yaş)','İpucu: “aksi kararlaştırılmadıkça” ifadesi'], a:`- **Emredici kural:** kamu düzenini, ahlakı veya zayıf tarafı korur; taraflar aksini kararlaştıramaz, aykırı sözleşme **kesin hükümsüzdür**. Örnek: evlenme yaşı; kişinin hak ve fiil ehliyetinden vazgeçememesi.
- **Tamamlayıcı kural:** taraflar bir konuyu düzenlemediyse boşluğu doldurur; aksi kararlaştırılabilir. Örnek: sözleşmede ifa yeri yoksa kanundaki ifa yeri kuralı uygulanır.
- **Yorumlayıcı kural:** tarafların kullandığı belirsiz ifadenin anlamını açıklar. Örnek: ödeme “ay başı” denmişse ayın birinci günü anlaşılır.
- **Tanımlayıcı kural:** bir kavramı tanımlar. Örnek: “Ergin olmak 18 yaşını doldurmakla başlar” (TMK m.11).
İpucu: “aksi kararlaştırılmadıkça” ifadesi tamamlayıcı veya yorumlayıcı kural işaretidir; “olamaz, geçersizdir” ifadesi emredici kural işaretidir.`},
 {t:'Yaptırım', ek:1, q:'Hukuki yaptırım türlerini açıklayınız.', k:['Ceza: suç işleyene (hapis, adli para)','Cebri icra: borcun devlet zoruyla yerine getirilmesi (haciz)','Tazminat: zararın parayla giderilmesi','Hükümsüzlük: hukuka aykırı işlemin sonuç doğurmaması (yokluk, kesin hükümsüzlük, iptal edilebilirlik)','İptal: idari işlemin mahkemece kaldırılması','Disiplin cezası: kurum içi düzene aykırılık'], a:`| Yaptırım | Anlamı | Örnek
| Ceza | Suç işleyene devletin uyguladığı yaptırım | Hapis, adli para cezası
| Cebri icra | Borcun devlet zoruyla yerine getirilmesi | Ödenmeyen borç için haciz
| Tazminat | Verilen zararın parayla giderilmesi | Trafik kazasında maddi ve manevi tazminat
| Hükümsüzlük | Hukuka aykırı işlemin istenen sonucu doğurmaması | Yokluk, kesin hükümsüzlük, iptal edilebilirlik
| İptal | İdari işlemin mahkeme kararıyla ortadan kaldırılması | Bir atama kararının iptali
| Disiplin cezası | Kurum içi düzene aykırılığın yaptırımı | Memura uyarı, kınama`},
 {t:'Yaptırım', q:'Yokluk, kesin hükümsüzlük ve iptal edilebilirlik arasındaki farkları açıklayınız.', k:['Yokluk: kurucu unsur eksik, işlem hiç doğmamış (memur önünde yapılmayan evlilik)','Kesin hükümsüzlük: emredici kural, ahlak, kamu düzeni, şekil','Kesin hükümsüzlüğü herkes ileri sürer, hâkim re\'sen dikkate alır, süresiz','İptal edilebilirlik: irade sakatlığı (yanılma, aldatma, korkutma)','İşlem geçerli doğar; sadece mağdur belli süre içinde ileri sürer'], a:`| | Yokluk | Kesin hükümsüzlük | İptal edilebilirlik
| Ne zaman? | Kurucu unsur eksik | Emredici kurala, ahlaka, kamu düzenine aykırılık; şekil eksikliği | İrade sakatlığı: yanılma, aldatma, korkutma
| İşlem doğdu mu? | Hiç doğmamış | Doğmuş ama baştan geçersiz | Geçerli doğmuş
| Kim ileri sürer? | Herkes; mahkeme kararına gerek yok | Herkes; hâkim kendiliğinden dikkate alır | Sadece iradesi sakatlanan kişi
| Süre | Yok | Süreye bağlı değil | Belli süre içinde
| Örnek | Evlendirme memuru önünde yapılmamış evlilik | Tapuda yapılmayan taşınmaz satışı | Aldatılarak imzalanan sözleşme`},
 {t:'Hukukun dalları', ek:1, q:'Kamu hukuku ile özel hukukun ayrım ölçütünü açıklayınız; her birine üç dal örneği veriniz. Medeni usul hukuku neden kamu hukukudur?', k:['Ölçüt: ilişkinin tarafları','Devlet egemenlik gücüyle taraf → kamu','Taraflar eşit → özel','Kamu: anayasa, idare, ceza, vergi, usul, icra-iflas','Özel: medeni, borçlar, ticaret, devletler özel','Medeni usul devletin yargı yetkisini düzenler → kamu','Karma: iş ve sosyal güvenlik hukuku'], a:`Ayrımın ölçütü **ilişkinin taraflarıdır**: devlet **egemenlik gücüyle** taraf ise ilişki kamu hukukuna, taraflar **eşit** ise özel hukuka girer.
- **Kamu hukuku:** anayasa, idare, ceza, vergi, ceza muhakemesi, medeni usul, icra ve iflas, devletler genel hukuku
- **Özel hukuk:** medeni hukuk, borçlar hukuku, ticaret hukuku, devletler özel hukuku
- **Karma:** iş hukuku, sosyal güvenlik hukuku
**Medeni usul hukuku**, adında “medeni” geçse de kamu hukukudur, çünkü devletin **yargı yetkisini** ve davaların nasıl görüleceğini düzenler. Aynı şekilde adında usul, muhakeme veya icra geçen dallar kamu hukukudur.`},
 {t:'Uygulama ve yorum', ek:1, q:'Kanunların zaman bakımından uygulanmasını açıklayınız (yürürlük, geriye yürümezlik ve istisnası, yürürlükten kalkma).', k:['Yürürlük tarihi kanunda yazar; yoksa RG\'de yayımdan 45 gün sonra','Geriye yürümezlik: yürürlükten sonraki olaylara uygulanır','İstisna: ceza hukukunda lehe kanun geriye yürür','Örnek: ceza hafifletilir ya da fiil suç olmaktan çıkar','Açık ilga: yeni kanun eskiyi kaldırdığını söyler','Örtülü ilga: yeni kanun eskisiyle çelişir'], a:`- **Yürürlük:** kanunun yürürlük tarihi kendi metninde yazar; yazmıyorsa Resmî Gazete'de yayımından itibaren **45 gün** sonra yürürlüğe girer.
- **Geriye yürümezlik:** kanun, yürürlüğe girdiği andan **sonraki** olaylara uygulanır; önceki olaylara uygulanmaz.
- **İstisna:** ceza hukukunda **lehe olan kanun geriye yürür**. Fiil suç olmaktan çıkarılırsa ya da ceza hafifletilirse, failin lehine olan kanun uygulanır.
- **Yürürlükten kalkma:** **açık ilga** (yeni kanun “şu kanun kaldırılmıştır” der) veya **örtülü ilga** (yeni kanun eskisiyle çelişir) yoluyla olur.`},
 {t:'Uygulama ve yorum', ek:1, q:'Yorum türlerini yorumu yapan bakımından ve yorum yöntemlerini açıklayınız.', k:['Yasama yorumu: kanun koyucu; bağlayıcı','Yargısal yorum: hâkim; o davada bağlayıcı','Bilimsel yorum: hukukçular; bağlayıcı değil','İdari yorum: idare; idare içinde bağlayıcı','Yöntemler: lafzi, tarihi, sistematik, amaçsal','Tarihi = yapıldığı dönemdeki amaç; amaçsal = bugünkü amaç'], a:`**Yorumu yapana göre:**
- **Yasama yorumu:** kanun koyucunun kendisi yapar; bağlayıcıdır.
- **Yargısal yorum:** hâkim yapar; o dava için bağlayıcıdır.
- **Bilimsel (doktriner) yorum:** hukukçular yapar; bağlayıcı değildir.
- **İdari yorum:** idare yapar (genelge vb.); idare içinde bağlayıcıdır.
**Yorum yöntemleri:**
| Yöntem | Neye bakar?
| Lafzi (sözel) | Kanunun kelimelerine ve dil bilgisine
| Tarihi | Kanun koyucunun yapıldığı dönemdeki amacına, gerekçeye
| Sistematik | Kuralın kanundaki yerine, diğer maddelerle ilişkisine
| Amaçsal (teleolojik) | Kuralın bugün korumak istediği amaca`},
 {t:'Olay soruları', q:'**Olay:** Ali, Ayşe\'ye ait bir arsayı noterde ya da tapuda değil, kendi aralarında yazdıkları bir kâğıtla satın almıştır. Bu satışın hukuki durumu nedir?', k:['Taşınmaz satışı kanunda resmi şekle bağlı','Şekil şartına uyulmamış','Sonuç: kesin hükümsüzlük','Herkes ileri sürebilir, hâkim re\'sen dikkate alır, süresiz','Geçerli mülkiyet devri olmaz'], a:`**Tespit:** Taşınmaz satışı kanunda **resmi şekle** (tapuda resmi senet) bağlanmıştır. Taraflar adi yazılı bir kâğıtla satış yapmıştır; şekil şartına uyulmamıştır.
**Sonuç:** Şekil eksikliği **kesin hükümsüzlük** nedenidir. Sözleşme baştan geçersizdir: herkes ileri sürebilir, hâkim kendiliğinden dikkate alır ve süreye bağlı değildir. Ali'ye geçerli bir mülkiyet devri olmaz.`},
 {t:'Olay soruları', q:'**Olay:** Mehmet, ikinci el bir araba almıştır. Satıcı, aracın kilometresini bilerek düşük göstermiştir. Sözleşmenin durumu nedir? Mehmet ne yapabilir?', k:['Satıcının bilerek yanıltması = aldatma','Aldatma irade sakatlığıdır','Sözleşme geçerli doğar ama iptal edilebilir','Sadece Mehmet, kanuni süre içinde ileri sürebilir','Zararı varsa tazminat isteyebilir'], a:`**Tespit:** Satıcının kilometreyi bilerek düşük göstermesi **aldatmadır**; aldatma bir **irade sakatlığıdır** (yanılma, aldatma, korkutma).
**Sonuç:** Sözleşme geçerli doğar, ama **iptal edilebilir** (nisbi butlan). Yalnızca iradesi sakatlanan **Mehmet**, kanundaki süre içinde sözleşmeyle bağlı olmadığını bildirerek onu ortadan kaldırabilir. Ayrıca zararı varsa **tazminat** isteyebilir.`},
 {t:'Olay soruları', q:'**Olay:** Can\'ın işlediği fiil, işlendiği tarihte 3 yıl hapisle cezalandırılıyordu. Dava sürerken çıkan yeni kanun (a) cezayı 1 yıla indirmiş, (b) başka bir senaryoda fiili suç olmaktan çıkarmıştır. Hangi kanun uygulanır?', k:['Kural: kanunlar geriye yürümez','İstisna: ceza hukukunda lehe kanun geriye yürür','(a) Lehe olan yeni kanun: 1 yıl uygulanır','(b) Fiil suç değil: Can cezalandırılamaz','Kesinleşmemiş dava vurgusu'], a:`**Kural:** Kanunlar kural olarak geriye yürümez.
**İstisna:** Ceza hukukunda **failin lehine olan kanun geriye yürür**.
**(a)** Yeni kanun cezayı 1 yıla indirdiği için Can'ın lehinedir; henüz kesinleşmemiş davada **yeni kanun (1 yıl)** uygulanır.
**(b)** Fiil artık suç olmadığı için Can **cezalandırılamaz**; eski kanunun hükmü uygulanmaz.`},
 {t:'Olay soruları', ek:1, q:'**Olay:** Ahmet bir sözleşmeyle “ömrü boyunca hiçbir hukuki işlem yapmayacağını ve fiil ehliyetinden vazgeçtiğini” kabul etmiştir. Bu hüküm geçerli midir?', k:['Kişinin hak ve fiil ehliyetinden vazgeçememesi emredici kural','Emredici kural aksi kararlaştırılamaz','Aykırı hüküm kesin hükümsüz','Herkes ileri sürer, hâkim re\'sen dikkate alır','Kişiliğin korunması / kamu düzeni gerekçesi'], a:`**Tespit:** Kişinin hak ve fiil ehliyetinden vazgeçememesi **emredici** bir kuraldır; kişiliği ve kamu düzenini korur, taraflar aksini kararlaştıramaz.
**Sonuç:** Emredici kurala aykırı bu hüküm **kesin hükümsüzdür**. Baştan geçersizdir; herkes ileri sürebilir ve hâkim kendiliğinden dikkate alır. Ahmet bu hükümle bağlı değildir.`},
 {t:'Olay soruları', ek:1, q:'**Olay:** Kanunda hiç düzenlenmemiş yeni bir teknolojiyle ilgili iki dava açılmıştır: (a) iki şirket arasında bir sözleşme uyuşmazlığı, (b) bu teknolojiyi kullanan Deniz hakkında açılan bir ceza davası. Hâkim her davada nasıl karar verir?', k:['Kanun boşluğu var','(a) Özel hukuk: TMK m.1 sırası','Önce kıyas (benzer kural), sonra örf-adet / hâkimin koyacağı kural','(b) Ceza hukuku: suç ve cezaların kanuniliği','Aleyhe kıyas yasak → Deniz cezalandırılamaz'], a:`Her iki davada da **kanun boşluğu** vardır, ama sonuç farklıdır.
**(a) Sözleşme uyuşmazlığı (özel hukuk):** Hâkim karar vermekten kaçınamaz. TMK m.1'e göre önce benzer bir konudaki kanun kuralını **kıyas** yoluyla uygular; yoksa örf ve adete bakar; o da yoksa kanun koyucu olsaydı koyacağı kurala göre karar verir.
**(b) Ceza davası:** **Suç ve cezaların kanuniliği** ilkesi gereği kanunda açıkça suç olarak tanımlanmayan fiil için kimse cezalandırılamaz; ceza hukukunda **aleyhe kıyas yasaktır**. Deniz cezalandırılamaz.`}
