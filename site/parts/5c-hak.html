/* ================= HUKUK · HAK KAVRAMI (kitap s. 130 ve sonrası; genel bilgiyle eklendi) ================= */
KL.law.push(
 {t:'Hak kavramı', ek:1, q:'Hakkı tanımlayınız ve hakkın niteliğini açıklayan teorileri karşılaştırınız.', k:['Tanım: hukuk düzeninin kişiye tanıdığı ve koruduğu yetki (sübjektif hukuk)','Hakkın karşısında başkasının ödevi vardır','İrade teorisi (Savigny, Windscheid): irade gücü; eleştiri iradesi olmayanlar','Menfaat teorisi (Jhering): korunan menfaat; eleştiri her menfaat hak değil','Karma teori (Jellinek): korunan menfaate ilişkin irade gücü; baskın görüş'], a:`**Hak**, hukuk düzeninin kişiye tanıdığı ve koruduğu yetkidir; objektif hukukun kişiye sağladığı bu yetkiye **sübjektif hukuk** da denir. Her hakkın karşısında başkasının bir ödevi bulunur.
| Teori | Hak nedir? | Eleştiri
| İrade teorisi (Savigny, Windscheid) | Hukuk düzeninin tanıdığı irade gücü | İradesi olmayan bebek ve akıl hastaları da hak sahibidir
| Menfaat teorisi (Jhering) | Hukuken korunan menfaat | Her menfaat hak değildir; hakkı kullanmak sahibinin iradesine bağlıdır
| Karma teori (Jellinek) | Hukuken korunan menfaate ilişkin irade gücü | İki teorinin eksiklerini giderir; bugün baskın görüş`},
 {t:'Hak kavramı', ek:1, q:'Kamu haklarını Jellinek\'in statü teorisine göre sınıflandırıp her birine örnek veriniz.', k:['Kamu hakları: kişinin devlete karşı hakları','Negatif statü (koruyucu): devlete karışmama ödevi','Örnek: kişi ve konut dokunulmazlığı, din-vicdan özgürlüğü','Pozitif statü (isteme): devletten edim isteme; eğitim, sağlık, sosyal güvenlik','Aktif statü (katılma): yönetime katılma; seçme-seçilme, kamu hizmetine girme'], a:`Kamu hakları, kişinin **devlete karşı** sahip olduğu haklardır. Jellinek bunları üçe ayırır:
| Tür | Anlamı | Örnek
| Negatif statü hakları (koruyucu haklar) | Devlete, kişinin alanına karışmama ödevi yükler | Kişi dokunulmazlığı, konut dokunulmazlığı, din ve vicdan özgürlüğü
| Pozitif statü hakları (isteme hakları) | Kişiye devletten bir edim isteme yetkisi verir | Eğitim, sağlık, sosyal güvenlik hakkı
| Aktif statü hakları (katılma hakları) | Kişinin devlet yönetimine katılmasını sağlar | Seçme ve seçilme, kamu hizmetine girme, dilekçe hakkı`},
 {t:'Hak kavramı', ek:1, q:'Mutlak hak ile nisbi hakkı, malvarlığı hakları ile kişi varlığı haklarını örneklerle karşılaştırınız.', k:['Mutlak hak: herkese karşı ileri sürülür (mülkiyet, kişilik, fikri haklar)','Nisbi hak: yalnızca belli kişiye karşı (alacak hakkı)','Malvarlığı hakları: para ile ölçülür, devredilir, mirasla geçer','Kişi varlığı hakları: ölçülemez, devredilemez, mirasla geçmez','Mutlak hak sınırsız değildir'], a:`| Ayrım | Bir yanda | Öbür yanda
| Kime karşı? | **Mutlak hak:** herkese karşı ileri sürülür. Örnek: mülkiyet, kişilik hakları, fikri haklar | **Nisbi hak:** yalnızca belli bir kişiye karşı ileri sürülür. Örnek: alacak hakkı, kiracının hakkı
| Para değeri | **Malvarlığı hakları:** para ile ölçülebilir, kural olarak devredilebilir ve mirasla geçer. Örnek: mülkiyet, alacak | **Kişi varlığı hakları:** para ile ölçülemez, devredilemez, mirasla geçmez. Örnek: yaşam, şeref, isim, velayet
Mutlak hak “sınırsız” anlamına gelmez; her hak dürüstlük kuralıyla sınırlıdır (TMK m.2).`},
 {t:'Hak kavramı', ek:1, q:'Yenilik doğuran hakları tanımlayıp türlerini örnekle açıklayınız.', k:['Tanım: tek taraflı irade beyanıyla hukuki durumu değiştirme yetkisi','Karşı tarafın kabulü gerekmez','Kurucu: önalım (şufa), alım hakkı','Değiştirici: seçimlik borçta seçim hakkı','Bozucu: sözleşmeden dönme, fesih, iptal'], a:`**Yenilik doğuran haklar**, hak sahibine **tek taraflı irade beyanıyla** bir hukuki durumu kurma, değiştirme ya da ortadan kaldırma yetkisi verir; karşı tarafın kabulü gerekmez.
| Tür | Etkisi | Örnek
| Kurucu | Yeni bir hukuki ilişki kurar | Önalım (şufa) hakkı, alım hakkı
| Değiştirici | Var olan ilişkinin içeriğini değiştirir | Seçimlik borçta seçim hakkı
| Bozucu | Var olan ilişkiyi sona erdirir | Sözleşmeden dönme, fesih, irade sakatlığında iptal`},
 {t:'Hak kavramı', ek:1, q:'Hakların aslen ve devren kazanılmasını açıklayınız. Zamanaşımı ile hak düşürücü süre arasındaki farklar nelerdir?', k:['Aslen kazanma: önceki sahipten bağımsız (sahipsiz malı sahiplenme)','Devren kazanma: önceki sahipten geçer','Külli halefiyet (miras) / cüz\'i halefiyet (satış, bağış)','Zamanaşımı: hak sürer, dava edilebilirlik zayıflar; borçlu def\'i olarak ileri sürer','Hak düşürücü süre: hak sona erer; hâkim re\'sen dikkate alır'], a:`**Aslen kazanma:** hak, önceki bir sahipten bağımsız olarak ilk kez doğar. Örnek: sahipsiz bir malı sahiplenme, avlanma.
**Devren kazanma:** hak önceki sahibinden yeni sahibine geçer. Malvarlığının bütün olarak geçmesi **külli halefiyettir** (miras); tek tek hakların geçmesi **cüz'i halefiyettir** (satış, bağış).
| | Zamanaşımı | Hak düşürücü süre
| Hakka etkisi | Hak sona ermez; dava edilebilirliği zayıflar | Hak tamamen sona erer
| Hâkim | Kendiliğinden dikkate almaz; borçlu def'i olarak ileri sürmelidir | Kendiliğinden dikkate alır
| Kesilme/durma | Kesilebilir, durabilir | Kural olarak kesilmez, durmaz`},
 {t:'Hak kavramı', ek:1, q:'TMK m.2 ve m.3\'ü açıklayınız. Hakkın korunmasında kendiliğinden hak alma (ihkak-ı hak) yasağı ve istisnaları nelerdir?', k:['m.2: hak kullanırken ve borç ifa ederken dürüstlük kuralına uyma','Hakkın açıkça kötüye kullanılmasını hukuk düzeni korumaz (örnek)','m.3: iyiniyetin varlığı asıldır (karine); özen göstermeyen iyiniyet iddia edemez','Kural: hak devlet eliyle, dava yoluyla korunur; ihkak-ı hak yasak','İstisnalar: meşru müdafaa, zorunluluk hâli, hakkı korumak için kuvvet kullanma'], a:`**TMK m.2 (dürüstlük kuralı):** Herkes haklarını kullanırken ve borçlarını yerine getirirken dürüstlük kurallarına uymak zorundadır. Bir hakkın **açıkça kötüye kullanılmasını** hukuk düzeni korumaz. Örnek: sadece komşunun manzarasını kapatmak amacıyla yüksek duvar örmek.
**TMK m.3 (iyiniyet):** Kanunun iyiniyete sonuç bağladığı durumlarda **asıl olan iyiniyetin varlığıdır**; iyiniyet bir karinedir, kötüniyeti iddia eden ispatlar. Ancak durumun gerektirdiği özeni göstermeyen kişi iyiniyet iddiasında bulunamaz.
**Hakkın korunması:** Kural olarak haklar **devlet eliyle, dava yoluyla** korunur; kişinin hakkını kendi gücüyle alması (**ihkak-ı hak**) yasaktır. İstisnaları: **meşru müdafaa**, **zorunluluk hâli** ve devletin yardımı zamanında sağlanamadığında **hakkı korumak için kuvvet kullanma**.`},
 {t:'Olay soruları', ek:1, q:'**Olay:** Selin, evinin bahçesine hiçbir ihtiyacı olmadığı hâlde, sırf komşusu Burak\'ın deniz manzarasını kapatmak için 6 metrelik bir duvar ördürmüştür. Burak ne yapabilir?', k:['Selin\'in mülkiyet hakkı mutlak haktır ama sınırsız değildir','TMK m.2: dürüstlük kuralı','Amaç sadece zarar vermek → hakkın açıkça kötüye kullanılması','Hukuk düzeni bu kullanımı korumaz','Burak dava yoluyla duvarın kaldırılmasını isteyebilir; kendisi yıkamaz (ihkak-ı hak yasağı)'], a:`**Tespit:** Selin mülkiyet hakkını kullanmaktadır; mülkiyet mutlak bir haktır. Ancak duvarın Selin'e hiçbir yararı yoktur, tek amacı Burak'a zarar vermektir.
**Kural:** TMK m.2'ye göre haklar dürüstlük kuralına uygun kullanılmalıdır; bir hakkın **açıkça kötüye kullanılmasını** hukuk düzeni korumaz. Mutlak hak sınırsız hak değildir.
**Sonuç:** Selin hakkını kötüye kullanmıştır ve bu kullanım korunmaz. Burak **dava açarak** duvarın kaldırılmasını isteyebilir; ama duvarı kendisi yıkamaz, çünkü kendiliğinden hak alma (ihkak-ı hak) yasaktır.`}
);
