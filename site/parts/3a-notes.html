## Muhasebe ve iş çevresi (teori)
!oz Muhasebe: kaydet → sınıflandır → özetle → yorumla | IASB → IFRS, FASB → US GAAP | Finansal muhasebe dış, yönetim muhasebesi iç kullanıcı içindir | Corporation sınırlı sorumlu; şahıs işletmesi ve ortaklıkta sorumluluk sınırsız
Muhasebe, işletme faaliyetlerini **ölçen**, verileri **raporlara işleyen** ve sonuçları **karar vericilere ileten** bilgi sistemidir. AICPA tanımındaki dört fiil: **recording, classifying, summarizing, interpreting** (kaydetme, sınıflandırma, özetleme, yorumlama). Bu fiiller parasal ve en azından kısmen finansal nitelikli işlemler için geçerlidir.
Muhasebe üç soruya cevap verir: işletmenin **ne kadar kaynağı** var, bu kaynaklar **nasıl finanse edildi**, kaynaklarla **hangi sonuç** elde edildi.
### Standart koyucular
| Kurum | Ürettiği standart | Nerede
| IASB | IFRS | 150'den fazla ülke (Türkiye dahil)
| FASB | US GAAP | ABD şirketleri
### Bilgi kullanıcıları
| Kullanıcı | İç/Dış | Ne için
| Yöneticiler | İç | Planlama, strateji, kaynak dağıtımı, kontrol
| Hissedarlar / yatırımcılar | Dış | Risk ve getiri; al–tut–sat kararı; temettü ödeme gücü
| Kreditörler / bankalar | Dış | Kredi ve faiz vadesinde ödenecek mi?
| Devlet | Dış | Vergilendirme, ekonomiyi teşvik, ulusal istatistik
| Çalışanlar, tedarikçiler, müşteriler, rakipler | Dış | İşletmenin sürekliliği ve gücü
### Finansal vs yönetim vs vergi muhasebesi
|  | Finansal | Yönetim | Vergi
| Kullanıcı | Dış (yatırımcı, banka, devlet) | İç (yöneticiler) | Vergi idaresi
| Kural | Ortak standartlar (IFRS/GAAP), karşılaştırılabilir | Serbest, ihtiyaca göre | Vergi mevzuatı
| Ürün | Bilanço, gelir tablosu, nakit akış tablosu | Bütçe, maliyet raporu | Vergi beyannamesi
+++ Yönetim muhasebesinin işlevleri
Yönetim muhasebesi yöneticinin üç işlevine hizmet eder: **Planning** (problemi tanımla → kriterleri sırala → alternatifleri bul → analiz et → en iyisini seç; bütçe genelde 1 yıllık plandır), **Implementation** (kaynakları sağlayıp planı uygulamak) ve **Control** (communicate, motivate, direct attention, appraise). **Operating information** günlük işler için gereken, hacmi en büyük veridir (çalışma saatleri, stok, müşteri borçları).

### Muhasebe döngüsü (sırası sorulabilir)
analyze → journalize → post → trial balance → adjusting entries → adjusted trial balance → financial statements → closing entries → post-closing trial balance
!ipucu Döngüyü “**A**li **J**ale'ye **P**asta **T**aşıdı” diye ilk dört adımla hatırla: Analyze, Journalize, Post, Trial balance. Sonrası düzeltme → tablolar → kapanış.

!sinav “Finansal ve yönetim muhasebesini karşılaştırınız.” · “Muhasebe bilgisinin kullanıcılarını açıklayınız.” · “İşletme biçimlerini sorumluluk ve vergi açısından karşılaştırınız.” Tablo hâlinde karşılaştırmak hem hızlı hem tam puanlık bir yoldur.
## Muhasebe denklemi ve işlem analizi
!oz A = L + OE her işlemden sonra dengede kalır | Gelir özkaynağı artırır; gider ve temettü azaltır | Prepaid = varlık, Unearned = borç | Tahsilat gelir değildir, borç ödemek gider değildir
Her işlem denklemin iki tarafını eşit etkiler; denklem **her zaman** dengede kalır.
$$ \text{Assets} = \text{Liabilities} + \text{Owner's Equity} $$
$$ \text{Owner's Equity} = \text{Capital} + \text{Revenues} - \text{Expenses} - \text{Dividends} $$
Assets − Liabilities = Net Assets = Owner's Equity. Varlıklar **historical cost** (alış maliyeti) ile kaydedilir.
| Grup | Tanım | Örnek hesaplar
| Assets (Varlık) | İşletmenin kontrol ettiği, ölçülebilir, gelecekte fayda sağlayacak kaynak | Cash, Accounts Receivable, Notes Receivable, Inventory, Supplies, Prepaid Expenses, Land, Building, Equipment, Furniture
| Liabilities (Borç) | Dışarıdakilere olan, geçmiş işlemden doğan yükümlülük | Accounts Payable, Notes Payable, Wages/Salaries Payable, Taxes Payable, Interest Payable, Unearned Revenue
| Owner's Equity (Özkaynak) | Sahibin varlıklar üzerindeki artık hakkı | Capital / Common Stock, Retained Earnings
| Revenues | Mal/hizmet satışı; **OE'yi artırır** | Service Revenue, Sales Revenue, Fee Revenue
| Expenses | Gelir elde etmek için katlanılan maliyet; **OE'yi azaltır** | Rent, Salary, Utilities, Advertising, Supplies Expense
| Dividends / Withdrawals | Sahibe yapılan dağıtım; **OE'yi azaltır ama gider değildir** | Dividends, Drawings
### Sık karıştırılanlar
- **Accounts Payable** = veresiye mal/hizmet alımından doğan borç; **Notes Payable** = yazılı senet/kredi borcu (genelde faizli).
- **Unearned Revenue** bir **borçtur**: para peşin alındı ama hizmet henüz verilmedi.
- **Prepaid Expense** bir **varlıktır**: gider peşin ödendi, faydası ileride kullanılacak.
- Veresiye hizmet verince gelir **o anda** kaydedilir (Accounts Receivable artar); tahsilat sadece varlık değişimidir, yeni gelir değildir.
- Borç ödemek gider değildir; sadece Cash ve borç birlikte azalır.
### Çözümlü örnek: A. Yılmaz Consulting (4. hafta)
1. Sahip 60.000 $ nakit koyar → Cash +60.000, Capital +60.000
2. 40.000 $'a nakit arsa → Cash −40.000, Land +40.000 (varlık değişimi)
3. 1.000 $ veresiye büro malzemesi → Supplies +1.000, A/P +1.000
4. 11.000 $ nakit hizmet geliri → Cash +11.000, Capital +11.000 (revenue)
5. 6.000 $ veresiye hizmet → A/R +6.000, Capital +6.000 (revenue)
6. Giderler nakit: bilgisayar kirası 1.200 + ofis kirası 2.200 + maaş 2.400 + elektrik/su 800 = 6.600 → Cash −6.600, Capital −6.600 (expense)
7. Eski borcun 600 $'ı ödenir → Cash −600, A/P −600

## Finansal tablolar
!oz Sıra: gelir tablosu → özkaynak tablosu → bilanço | Gelir ve özkaynak tablosu bir dönemi (film), bilanço bir tarihi (fotoğraf) gösterir | Temettü ve sahip yatırımı gelir tablosuna girmez | Her tablonun üç satırlık başlığı olur
Tablolar **bu sırayla** hazırlanır, çünkü her biri bir sonrakini besler: Gelir tablosu → (Net Income) → Özkaynak değişim tablosu → (dönem sonu Capital / Retained Earnings) → Bilanço.
| Tablo | Ne gösterir | Zaman | Hocanın benzetmesi
| Income Statement (P/L) | Gelirler − Giderler = Net kâr/zarar | Bir **dönem** (“for the year ended…”) | Film
| Statement of Owner's Equity | Dönem başı sermaye + yatırım + net kâr − temettü/çekiş = dönem sonu | Bir **dönem** | Film
| Balance Sheet (Statement of Financial Position) | Varlıklar = Borçlar + Özkaynak | Belirli bir **tarih** (“31.12.2023”) | Fotoğraf
| Statement of Cash Flows | Nakit giriş–çıkışları | Bir dönem | —
Her tablonun **üç satırlık başlığı** olur: şirket adı, tablonun adı, dönem/tarih. Başlığı eksik yazmak puan kaybettirebilir.
**Bilanço sınıflandırması:** Cari varlıklar 1 yıl içinde nakde dönen/kullanılanlar (Cash, kısa vadeli yatırımlar, A/R, Inventory, Supplies, Prepaid); uzun vadeli varlıklar PP&E (Land, Building, Equipment), maddi olmayan duran varlıklar, uzun vadeli yatırımlar. Cari borçlar 1 yıl içinde ödenecekler (A/P, Salaries Payable, Taxes Payable, kısa vadeli krediler, Unearned Revenue); uzun vadeli borçlar long-term notes payable, mortgage payable. Türkiye'de borsada işlem gören şirketler tablolarını **üç ayda bir** hazırlar.

| + Owner investment | 60.000
| + Net Income | 10.400
| − Dividends / Withdrawals | (0)

### Tuzaklar
!tuzak Temettü/çekiş **gelir tablosunda yer almaz**; sadece özkaynak tablosunda düşülür. Sahibin yatırımı gelir değildir; o da özkaynak tablosuna gider. Varlık alımı (arsa, malzeme) gider değildir; bilançoda varlık olarak durur. Bilançodaki sermaye, özkaynak tablosunun **son satırıyla** aynı olmalı.

!sinav “Verilen bilgilerden gelir tablosu, özkaynak değişim tablosu ve bilançoyu hazırlayınız.” Üç satırlık başlıkları yaz, ara toplamları göster, bilançodaki sermayenin özkaynak tablosunun son satırıyla aynı olduğunu kontrol et.
## Borç/alacak, T-hesap, yevmiye ve defteri kebir
!oz Debit = sol, credit = sağ; her kayıtta toplamlar eşit | DEA borçla, LCR alacakla artar | Akış: yevmiye → posting → ledger (T-hesaplar) → mizan
Tek kural: **Debit = sol, Credit = sağ.** Her işlem en az iki hesabı etkiler ve toplam debit = toplam credit olur (double-entry).
| Hesap grubu | Artış | Azalış | Normal bakiye
| Assets | Debit | Credit | Debit
| Dividends / Withdrawals | Debit | Credit | Debit
| Expenses | Debit | Credit | Debit
| Liabilities | Credit | Debit | Credit
| Capital / Common Stock | Credit | Debit | Credit
| Revenues | Credit | Debit | Credit
!ipucu **DEA** (Dividends, Expenses, Assets) borç tarafında artar; **LCR** (Liabilities, Capital, Revenues) alacak tarafında artar. Mantık: gider ve temettü özkaynağı azaltır; özkaynak alacakla artan bir hesap olduğu için onların artışı borca yazılır. “Araç” sekmesindeki Borç/Alacak antrenmanıyla hızlan.
+++ Hızlı kontrol listesi (5. hafta slaytı)
**Hızlı kontrol (5. hafta slaytı):** nakit artışı → Dr; A/R artışı → Dr; A/P artışı → Cr; malzeme azalışı → Cr; gelir artışı → Cr; kira gideri artışı → Dr; common stock artışı → Cr; notes payable azalışı → Dr; nakit azalışı → Cr; withdrawal artışı → Dr.

### Sık işlem kalıpları
Klasik sınavdaki yevmiye sorularının çoğu bu kalıplardan biridir. İşlemi okuyunca önce hangi satıra uyduğunu bul.
| İşlem | Debit (borç) | Credit (alacak)
| Sahip / hissedar nakit koyar | Cash | Capital / Common Stock
| Sahip nakit dışı varlık koyar | Varlık (Furniture, Equipment) | Capital / Common Stock
| Nakitle varlık alımı | Varlık (Land, Equipment) | Cash
| Veresiye alım | Varlık (Supplies) | Accounts Payable
| Senetle alım | Varlık (Building) | Notes Payable
| Banka kredisi alınır | Cash | Notes Payable
| Nakit hizmet geliri | Cash | Service Revenue
| Veresiye hizmet | Accounts Receivable | Service Revenue
| Hizmet öncesi peşin tahsilat | Cash | Unearned Revenue
| Gider nakit ödenir | ... Expense | Cash
| Gider gerçekleşti, ödenmedi | ... Expense | ... Payable
| Gider peşin ödenir | Prepaid ... | Cash
| Satıcıya borç ödenir | Accounts Payable | Cash
| Müşteriden tahsilat | Cash | Accounts Receivable
| Temettü / çekiş | Dividends / Withdrawals | Cash
### Kayıt süreci (5 adım)
1. Etkilenen hesapları ve türlerini belirle (A, L, OE).
2. Her hesap artıyor mu azalıyor mu; Dr/Cr kuralını uygula.
3. Yevmiyeye (journal) tarih sırasıyla kaydet.
4. Defteri kebire (ledger, T-hesaplar) aktar = **posting**.
5. Denklemin dengede olduğunu kontrol et.
**Yevmiye kaydı formatı:** önce borçlu hesap ve tutar sol sütunda; altında **içeri girintili** alacaklı hesap ve tutar sağ sütunda; en altta kısa açıklama.
| Tarih | Hesap | Debit | Credit
| Nov 1 | Cash | 30.000 |
|  |     Common Stock |  | 30.000
|  | *Issued common stock* |  |
**Posting ve T-hesap:** Her hesabın bir T'si vardır; yevmiyedeki borç tutarı o hesabın sol tarafına, alacak tutarı sağ tarafına taşınır. Tüm T-hesapların toplamı **ledger**dır. Bakiye = büyük taraf − küçük taraf, büyük tarafa yazılır.
Örnek (5. hafta): Cash'in açılış bakiyesi 1.000 (Dr). 10 Ekim'de 700 $ nakit danışmanlık geliri → Cash Dr 700 / Service Revenue Cr 700. Cash bakiyesi = 1.000 + 700 = **1.700 Dr**.
### Tanımlar (kısa cevaplı soru gelebilir)
- **Transaction:** işletmenin finansal durumunu etkileyen ve güvenilir ölçülebilen olay.
- **Account:** her varlık, borç ve özkaynak kalemi için artış/azalışları gösteren kayıt; muhasebenin temel özetleme aracı.
- **Journal:** işlemlerin kronolojik kaydı. **Ledger:** hesapların ve bakiyelerinin toplandığı kayıt.
- **Deferred (unearned) revenue:** peşin tahsil edilip henüz hak edilmemiş gelir → borç. **Accrued liability:** gerçekleşmiş ama ödenmemiş gider (Salaries Payable, Interest Payable).
- **Retained earnings:** birikmiş net kâr − dağıtılan temettüler.
- **Cari borç:** 1 yıl veya faaliyet döngüsü içinde (hangisi uzunsa) ödenecek borç.
### Mizan (trial balance)
Slaytlarda henüz yok. Tüm hesapların bakiyelerinin listesidir; borç bakiyeleri bir sütuna, alacak bakiyeleri diğerine yazılır ve iki toplam **eşit** olmalıdır.
!tuzak Mizanın dengede olması kayıtların hatasız olduğunu kanıtlamaz: yanlış hesaba yazılmış ama tutarı doğru bir kayıt, hiç kaydedilmemiş bir işlem ya da iki kez kaydedilmiş bir işlem mizanı bozmaz.

!sinav “Aşağıdaki işlemlerin yevmiye kayıtlarını yapınız, Cash hesabını T-hesapta gösteriniz ve mizanı hazırlayınız.” Alacaklı hesabı içeri girintili yaz; her kaydın borç ve alacak toplamı eşit olmalı.

## Nasıl çalışmalı
Sınav tamamen çoktan seçmeli (vize %40, final %60) ve kaynak kitap Mankiw, *Principles of Economics*. Konular Türkçe anlatıldı, İngilizce terimler parantez içinde; sınavda sorular İngilizce gelecek.
Sıra: konu anlatımını oku → Kartlar sekmesinde terimleri pekiştir → Test sekmesinde soruları çöz → Araç sekmesindeki esneklik hesaplayıcıyla alıştırma yap.
!tuzak **En sık tuzak:** “talepte değişme” (eğrinin kayması) ile “talep edilen miktarda değişme” (eğri üzerinde hareket) ayrımı. Bu ayrım arz için de aynıdır.

## Hafta 1 – Ekonomi nedir ve On İlke
!oz Kıtlık → seçim → ödünleşim ve fırsat maliyeti | On ilke 4–3–3: bireysel karar, etkileşim, bütün ekonomi | Piyasa başarısızlığı: dışsallık ve piyasa gücü
### Temel tanımlar
- **Ekonomi (economy):** Yunanca “haneyi yöneten kişi” kelimesinden gelir. Toplumda kaynaklar tek bir merkezî planlayıcıyla değil, milyonlarca hane ve firmanın ortak kararlarıyla dağıtılır.
- **Kıtlık (scarcity):** Toplumun kaynakları sınırlıdır; insanların istediği tüm mal ve hizmetleri üretemez.
- **İktisat (economics):** Toplumun kıt kaynaklarını nasıl yönettiğini inceleyen bilim. Diğer tanım: kıt kaynakların sınırsız insan ihtiyaçlarını karşılamak için kullanımının incelenmesi.
- **Karar alıcılar (decision makers):** bireyler (hane halkı), firmalar ve devlet.
### Ekonominin On İlkesi (Ten Principles of Economics)
İlkeler üç gruba ayrılır ve bu gruplama sınavda sorulabilir: **1–4** bireysel karar alma, **5–7** ekonomik aktörlerin etkileşimi, **8–10** ekonominin bütünü.
| No | İlke | Türkçe anlamı ve kilit nokta | Slayttaki örnek
| 1 | People face trade-offs | Ödünleşim. “Bedava öğle yemeği yoktur.” Önemli ödünleşim: **verimlilik (efficiency)** – kıt kaynaklardan en fazlasını elde etmek ile **hakkaniyet (equity)** – refahın adil dağıtılması. | Hafta sonu ders vs gezi; temiz çevre vs yüksek büyüme
| 2 | The cost of something is what you give up to get it | **Fırsat maliyeti (opportunity cost):** bir şeyi elde etmek için vazgeçilen her şey. | Üniversiteye gitmek vs çalışmak
| 3 | Rational people think at the margin | **Marjinal değişiklik:** planın kenarlarındaki küçük, artımlı ayarlamalar. | Açken pizza vs tokken bir dilim daha
| 4 | People respond to incentives | Teşvik = fiyat, miktar ya da politikalardaki değişiklikler. | Çevre dostu otomobillere vergi indirimi
| 5 | Trade can make everyone better off | Rekabet → uzmanlaşma ve çeşitlilik artışı. | Dış ticarete açılmak
| 6 | Markets are usually a good way to organize economic activity | **Piyasa ekonomisi:** kaynakları merkezî olmayan kararlarla dağıtır. Zıttı: merkezî planlı ekonomi. Adam Smith'in **görünmez el (invisible hand)** fikri. | Vergiler fiyat ayarlamasını bozabilir
| 7 | Governments can sometimes improve market outcomes | **Piyasa başarısızlığı (market failure)** iki nedenle: **dışsallık (externality)** ve **piyasa gücü (market power)**. | Kirlilik, tekel
| 8 | A country's standard of living depends on its ability to produce goods and services | Farkların nedeni **verimlilik (productivity):** bir işçinin bir saatte ürettiği miktar. | Eğitim, Ar-Ge sübvansiyonu
| 9 | Prices rise when the government prints too much money | **Enflasyon:** genel fiyat düzeyinin artması. Friedman: “Enflasyon her zaman parasal bir olgudur.” | Arjantin
| 10 | Society faces a short-run trade-off between inflation and unemployment | **Phillips eğrisi**. Fiyatlar kısa dönemde yapışkandır (sticky). | Enflasyonu düşürmek kısa vadede işsizliği artırabilir
!ipucu Grupları “**4–3–3**” diye ezberle: 4 bireysel (trade-off, cost, margin, incentives), 3 etkileşim (trade, markets, government), 3 bütün ekonomi (productivity, money, Phillips).
**Akılda tut:** Adam Smith (1723–1790) görünmez el ve *Wealth of Nations* (1776) ile; David Ricardo (1772–1823) karşılaştırmalı üstünlük ile anılır.

!sinav Testte ilke numarası değil grubu sorulur (“Which principle is about individual decision making?”). Equity ↔ efficiency tanımları sık yer değiştirir.
## Hafta 2 – Bir ekonomist gibi düşünmek
!oz PPF: üzerinde etkin, içinde etkin değil, dışında ulaşılamaz | Dışa bükük = artan fırsat maliyeti; teknoloji eğriyi dışa kaydırır | Karşılaştırmalı üstünlük = daha düşük fırsat maliyeti
### Bilim olarak iktisat ve modeller
İktisatçılar teori kurar, veri toplar ve bu veriyle teoriyi doğrulamaya ya da çürütmeye çalışır. **Varsayımlar (assumptions)** dünyayı anlamayı kolaylaştırır. **İktisadi modeller** gerçekliğin özünü temsil eden diyagram ve denklemlerdir. Derste iki model işlendi: Üretim İmkânları Eğrisi ve Dairesel Akım Diyagramı.
### Üretim İmkânları Eğrisi (Production Possibilities Frontier, PPF)
Mevcut üretim faktörleri ve teknolojiyle ekonominin üretebileceği çıktı bileşimlerini gösteren grafik. Kıtlık ve verimliliğin görsel modelidir.
@fig ppf | Üretim imkânları eğrisi: A etkin, B etkin değil, C ulaşılamaz
- **Eğrinin üzerindeki nokta (A):** etkin (efficient). Bir maldan daha fazla üretmek için diğerinden vazgeçmek gerekir.
- **Eğrinin içindeki nokta (B):** etkin değil (inefficient). Kaynaklar tam kullanılmıyor (ör. işsizlik).
- **Eğrinin dışındaki nokta (C):** mevcut kaynaklarla ulaşılamaz.
- **Eğri üzerinde hareket:** ödünleşim; vazgeçilen miktar fırsat maliyetidir.
- **Dışa bükük (bowed outward) şekil:** fırsat maliyeti artar, çünkü kaynaklar her malın üretimine eşit derecede uygun değildir.
- **Teknolojik gelişme:** eğriyi dışa kaydırır. Sadece bilgisayar üretiminde gelişme olursa eğri yalnızca bilgisayar ekseni yönünde genişler.
### Üretim faktörleri (factors of production)
- **Toprak (land):** tarım arazisi, gayrimenkul, ayrıca petrol ve altın gibi doğal kaynaklar.
- **Emek (labour):** bir ürünü piyasaya getirmek için harcanan fiziksel ve zihinsel çaba.
- **Sermaye (capital):** makine, alet, fabrika, bina gibi insan yapımı üretim faktörleri.
!tuzak **Para bir üretim faktörü değildir.** Sermaye = fiziksel sermaye (makine, bina).
### Dairesel Akım Diyagramı (Circular-Flow Diagram)
@fig flow | Dairesel akım: iç döngü mal ve faktörler, dış döngü para
- **İki aktör:** hane halkı (households) ve firmalar (firms). Temel modelde devlet ve dış ticaret yoktur.
- **İki piyasa:** mal ve hizmet piyasası ile üretim faktörleri piyasası.
- **İç döngü:** mal-hizmet ve üretim faktörlerinin akışı. **Dış döngü:** paranın akışı (harcama, gelir, ücret, kira, kâr).
- Hane halkı emeğini **faktör piyasasında** satar, malları **mal piyasasında** alır. Firmalar bunun tersini yapar.
### Mikro ve makro iktisat
- **Mikroiktisat:** tek tek karar birimlerini (hane, firma, tek bir piyasa) inceler.
- **Makroiktisat:** toplam ekonominin davranışını (enflasyon, işsizlik, büyüme) inceler.
### Mutlak ve karşılaştırmalı üstünlük (Bölüm 3)
**Mutlak üstünlük (absolute advantage):** bir malı daha az girdiyle üretebilmek. **Karşılaştırmalı üstünlük (comparative advantage):** bir malı daha düşük fırsat maliyetiyle üretebilmek. İki ülke ve iki malda, bir ülke bir malda karşılaştırmalı üstünlüğe sahipse diğer ülke mutlaka diğer malda karşılaştırmalı üstünlüğe sahiptir. Ticaretten kazanç karşılaştırmalı üstünlükten doğar.
!ek **Hesap örneği:** Türkiye 1 saatte 4 araba ya da 8 bilgisayar, Almanya 6 araba ya da 6 bilgisayar üretebiliyor. Türkiye'de 1 arabanın fırsat maliyeti 2 bilgisayar, Almanya'da 1 bilgisayar. Arabada karşılaştırmalı üstünlük **Almanya'da**, bilgisayarda **Türkiye'de** (1 bilgisayar = 0,5 araba < 1 araba). Mutlak üstünlük arabada Almanya'da, bilgisayarda Türkiye'de.

!sinav “A point inside the PPF is…” · “Which is NOT a factor of production?” (para) · iki ülke–iki mal fırsat maliyeti hesabı.
## Hafta 3–4 – Arz ve talep
!oz Kendi fiyatı → eğri üzerinde hareket; diğer etkenler → eğri kayar | Fiyat > denge: arz fazlası · fiyat < denge: kıtlık | İki eğri birlikte kayarsa P ya da Q belirsiz kalır
### Piyasa ve rekabet
**Piyasa (market):** belirli bir mal ya da hizmetin alıcı ve satıcılarından oluşan grup.
| Piyasa türü | Firma sayısı | Ürün
| Tam rekabet (perfect competition) | Çok | Özdeş (identical)
| Monopolcü rekabet (monopolistic competition) | Çok | Farklılaştırılmış (differentiated)
| Oligopol (oligopoly) | Birkaç | Özdeş ya da farklı
| Tekel (monopoly) | Bir | Tek ürün
**Tam rekabetin özellikleri:** mallar özdeştir; alıcı ve satıcılar **fiyat alıcıdır (price takers)**; her iki taraf da fiyatlar hakkında **tam bilgiye** sahiptir; giriş ve çıkış serbesttir. Satıcının alıcıdan daha fazla bilgiye sahip olması tam rekabetle **çelişir**.
### Talep (demand)
**Talep edilen miktar (quantity demanded):** alıcıların satın almaya istekli ve gücü yeten olduğu miktar.
**Talep yasası (law of demand):** diğer her şey sabitken (ceteris paribus) fiyat artınca talep edilen miktar düşer. Talep eğrisi negatif eğimlidir.
Talebin belirleyicileri:
1. **Malın kendi fiyatı** → eğri üzerinde hareket.
2. **Gelir:** **normal mal** – gelir artınca talep artar; **düşük mal (inferior good)** – gelir artınca talep azalır (toplu taşıma, ucuz markalar).
3. **İlişkili malların fiyatları:** **ikame (substitutes)** – birinin fiyatı artınca diğerinin talebi artar (çay–kahve); **tamamlayıcı (complements)** – birinin fiyatı artınca diğerinin talebi azalır (araba–benzin).
4. **Zevk ve tercihler (tastes)**
5. **Beklentiler (expectations)**
6. **Alıcı sayısı** (Mankiw ekler)
**Piyasa talebi:** bireysel taleplerin yatay toplamı (her fiyatta miktarlar toplanır). **Ceteris paribus:** “diğer her şey sabitken”.
### En önemli ayrım: kayma ve hareket
@fig shift | Sol: fiyat değişince eğri üzerinde hareket. Sağ: fiyat dışı etken eğriyi kaydırır
| Ne değişti? | Sonuç | Terim
| Malın kendi fiyatı | Eğri **üzerinde hareket** | Talep edilen miktarda değişme (change in quantity demanded)
| Fiyat dışı belirleyici (gelir, ilişkili mal fiyatı, zevk, beklenti, alıcı sayısı) | Eğrinin **kayması** | Talepte değişme (change in demand)
Her fiyatta talep edilen miktarı artıran değişiklik eğriyi **sağa**, azaltan **sola** kaydırır. Slayttaki örnek: sigarayı caydıran bir kampanya talep eğrisini **sola kaydırır**; sigara vergisinin fiyatı artırması ise eğri **üzerinde yukarı doğru hareket** demektir.
### Arz (supply)
**Arz yasası:** diğer her şey sabitken fiyat artınca arz edilen miktar artar. Arz eğrisi pozitif eğimlidir.
Arzın belirleyicileri: (1) malın kendi fiyatı → eğri üzerinde hareket; (2) **girdi fiyatları** – artarsa arz sola kayar; (3) **teknoloji** – arzı sağa kaydırır; (4) **beklentiler**; (5) satıcı sayısı.
### Denge (equilibrium)
- **Denge:** iki eğrinin kesiştiği nokta. **Denge fiyatı** = piyasayı temizleyen fiyat (market-clearing price).
- **Fiyat dengenin üstündeyse:** arz edilen > talep edilen → **arz fazlası (surplus)** → fiyat düşer.
- **Fiyat dengenin altındaysa:** talep edilen > arz edilen → **kıtlık (shortage)** → fiyat yükselir.
- Fazla ve kıtlıklar geçicidir; piyasa fiyatı kendiliğinden dengeye götürür.
### Karşılaştırmalı statik: 3 adım
1. Olay arzı mı, talebi mi (ya da ikisini) etkiliyor?
2. Eğri hangi yöne kayıyor?
3. Yeni dengede fiyat (P) ve miktar (Q) ne oluyor?
| Olay (dondurma piyasası) | Kayma | Fiyat | Miktar
| Çok sıcak bir yaz | Talep sağa | Artar | Artar
| Deprem fabrikaları yıkıyor | Arz sola | Artar | Azalır
| İkisi birlikte | Talep sağa + arz sola | Kesin artar | **Belirsiz**
!ipucu İki eğri aynı anda kayınca biri (P ya da Q) kesin, diğeri belirsizdir. Aynı yöne kayıyorlarsa **Q** kesin; ters yöne kayıyorlarsa **P** kesin.
| Talep | Arz | P | Q
| Artar | Artar | Belirsiz | Artar
| Artar | Azalır | Artar | Belirsiz
| Azalır | Artar | Azalır | Belirsiz
| Azalır | Azalır | Belirsiz | Azalır

!sinav Şıklarda “shift” ile “movement along” yer değiştirir. Önce olayın malın kendi fiyatı mı, başka bir etken mi olduğuna bak.
## Hafta 4–5 – Esneklik
!oz E = %ΔQ / %ΔP; orta nokta yöntemi yönden bağımsız | Dikey eğri tam inelastik, yatay eğri tam elastik | Gelir esnekliği: normal +, düşük −; çapraz: ikame +, tamamlayıcı −
**Esneklik:** bir iktisadi değişkenin başka bir değişkendeki değişime ne kadar duyarlı olduğunun ölçüsü (tepki verme derecesi).
### Talebin fiyat esnekliği (PED)
Talep yasası nedeniyle işaret negatiftir, ama Mankiw'de **mutlak değer** kullanılır.
**Esnekliği belirleyenler:**
- **Zorunlu vs lüks:** zorunlu mallar (ilaç, ekmek) inelastik, lüks mallar (yat, tatil) elastik.
- **Yakın ikameler:** ikamesi çok olan mal daha elastik (tereyağı ↔ margarin).
- **Piyasanın tanımı:** dar tanımlı piyasa daha elastik (“gıda” inelastik, “vanilyalı dondurma” elastik).
- **Zaman ufku:** uzun dönemde talep daha elastiktir.
**i. Yüzde değişim yöntemi:**
$$ E_d = \frac{\%\Delta Q_d}{\%\Delta P}, \qquad \%\Delta Q = \frac{Q_2 - Q_1}{Q_1}\times 100 $$
**ii. Orta nokta yöntemi (midpoint):** değişim, başlangıç ve son değerin ortalamasına bölünür; yönden bağımsız aynı sonucu verdiği için tercih edilir.
$$ E_d = \frac{(Q_2 - Q_1)/[(Q_2 + Q_1)/2]}{(P_2 - P_1)/[(P_2 + P_1)/2]} $$
### Esneklik derecelerine göre talep eğrileri
| Değer | Ad | Eğri | Anlamı
| E = 0 | Tam inelastik (perfectly inelastic) | Dikey | Fiyat ne olursa olsun miktar değişmez
| 0 < E < 1 | İnelastik | Dik | Miktar fiyattan daha az oranda değişir
| E = 1 | Birim esnek (unit elastic) | Orta | Aynı oranda değişir
| E > 1 | Elastik | Yatık | Miktar fiyattan daha fazla oranda değişir
| E = ∞ | Tam elastik (perfectly elastic) | Yatay | En küçük fiyat artışı miktarı sıfıra indirir
!ipucu Eğri ne kadar **yatıksa** o kadar **elastik**, ne kadar **dikse** o kadar **inelastik**. “**D**ik = **D**uyarsız”.
### Diğer esneklikler
- **Gelir esnekliği** = %ΔQd / %ΔGelir. **Normal mal → pozitif**, **düşük mal → negatif**. Zorunlu normal mallar 0–1 arası, lüks mallar 1'den büyük.
- **Çapraz fiyat esnekliği** = %ΔQd(1) / %ΔP(2). **İkameler → pozitif**, **tamamlayıcılar → negatif**.
- **Arzın fiyat esnekliği** = %ΔQs / %ΔP. **Uzun dönemde daha elastiktir** (fabrika kurulur, yeni firmalar girer). Miktarı sabit olan şeylerin (sahil arsası) arzı tam inelastiktir.
!ek **Toplam gelir (TR = P × Q) ve esneklik** (Mankiw 5. bölüm; slaytta yoksa hızlıca geç): Talep **inelastikse** fiyat artışı toplam geliri **artırır**; **elastikse** fiyat artışı toplam geliri **azaltır**; birim esnekse değişmez. Tarım örneği bu yüzden işler: verim artışı fiyatı çok düşürür, inelastik talepte çiftçinin geliri azalır.
### Slayttaki alıştırma: sütün arz esnekliği
Sütün litre fiyatı 30 TL'den 40 TL'ye çıkınca aylık üretim 10.000 litreden 12.000 litreye çıkıyor.
- **Yüzde değişim:** %ΔQ = 2.000/10.000 = %20; %ΔP = 10/30 = %33,3 → **Es = 0,60** (inelastik).
- **Orta nokta:** %ΔQ = 2.000/11.000 = %18,2; %ΔP = 10/35 = %28,6 → **Es ≈ 0,64** (inelastik).
### Uygulama: OPEC neden petrol fiyatını yüksek tutamadı?
- **Kısa dönemde** hem arz hem talep inelastiktir: arzdaki azalma fiyatı **çok** yükseltir.
- **Uzun dönemde** her iki eğri de elastikleşir: tüketiciler tasarruf eder, OPEC dışı üreticiler üretimi artırır; aynı arz azalması fiyatı **daha az** yükseltir.
- **Sonuç:** OPEC yüksek fiyatı yalnızca kısa dönemde koruyabildi.
Diğer iki uygulama: tarımda verim artışı, talep inelastik olduğu için fiyatı çok düşürür ve çiftçinin toplam gelirini azaltabilir; uyuşturucu yasağı (arz kısıtlaması), talep inelastik olduğundan fiyatı ve kullanıcıların harcamasını artırarak suçu artırabilir.

!sinav Orta nokta yöntemiyle esneklik hesabı ve sınıflandırma (Araç sekmesindeki hesaplayıcıyla alıştırma yap) · işaretten mal türü bulma.
## Terimler sözlüğü
| İngilizce | Türkçe | Kısa tanım

| Efficiency / Equity | Verimlilik / Hakkaniyet | Pastayı büyütmek / pastayı adil bölmek
| Opportunity cost | Fırsat maliyeti | Vazgeçilen en iyi alternatif

| Incentive | Teşvik | Davranışı değiştiren fiyat, miktar ya da politika
| Invisible hand | Görünmez el | Kişisel çıkarın piyasada toplumsal faydaya yol açması (Smith)
| Market failure | Piyasa başarısızlığı | Piyasanın kaynakları etkin dağıtamaması
| Externality | Dışsallık | Bir eylemin üçüncü kişiye etkisi
| Market power | Piyasa gücü | Fiyatları etkileyebilme gücü
| Productivity | Verimlilik (üretkenlik) | İşçi başına saatlik üretim
| Phillips curve | Phillips eğrisi | Kısa dönem enflasyon–işsizlik ödünleşimi
| Price taker | Fiyat alıcı | Piyasa fiyatını veri kabul eden
| Normal / Inferior good | Normal / Düşük mal | Gelir ↑ → talep ↑ / talep ↓
| Substitutes / Complements | İkame / Tamamlayıcı | Çay–kahve / araba–benzin
| Surplus / Shortage | Arz fazlası / Kıtlık | Fiyat dengenin üstünde / altında
| Comparative statics | Karşılaştırmalı statik | Eski ve yeni dengeyi karşılaştırma

## Hocanın çalışma soruları (Hafta 5 slaytı)
Bu sorular sınav tarzını gösteriyor. Önce kendin cevapla, sonra aç.
?? 1. İktisadın en doğru tanımı hangisi? || **a** — Sınırsız isteklerin kıt kaynaklarla nasıl karşılanacağını inceleyen sosyal bilim. Kıtlık vurgusu olan tek şık.
?? 2. “Elektrikli arabalara vergi indirimi tüketiciyi geleneksel arabalardan uzaklaştırır” hangi ilke? || **d** — People respond to incentives.
?? 3. Temel dairesel akım diyagramı için doğru ifade? || **c** — Para akışı ve mal-hizmet akışı vardır. Temel modelde devlet ve dış ticaret yoktur; hane halkı emeğini faktör piyasasında satar.
?? 4. X ülkesi arabada karşılaştırmalı üstünlüğe sahipse? || **c** — Y ülkesi diğer malda (bilgisayar) karşılaştırmalı üstünlüğe sahiptir. Mutlak üstünlük hakkında bilgi yoktur.
?? 5. ÜİE neden dışa bükük? || **b** — Kaynaklar her malın üretimine eşit uygun değildir → artan fırsat maliyeti.
?? 6. Tam rekabette olmayan özellik? || **c** — Tam rekabette herkes tam bilgiye sahiptir; satıcının daha çok bilmesi bunu bozar.
?? 7. Bir mal ne zaman normal kabul edilir? || **c** — Tüketicinin geliri artınca talebi artıyorsa.
?? 8. Talep yasası neyi ifade eder? || **c** — Ceteris paribus fiyat artınca talep edilen miktar düşer.
?? 9. Arz eğrisi ne zaman sağa kayar? || **b** — Üretimi verimli yapan teknoloji. Fiyat artışı eğri üzerinde hareket, girdi fiyatı artışı sola kayma.
?? 10. Büyük bir göç dalgası nihai mal piyasasını nasıl etkiler? (açık uçlu) || Alıcı sayısı artar → **talep sağa kayar** → fiyat ve miktar artar. Göçmenler emek arzını artırıp maliyeti düşürürse **arz da sağa kayar**; o zaman miktar kesin artar, fiyat belirsizdir. İki kanalı da yazmak en güvenli cevap.
