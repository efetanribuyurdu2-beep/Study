<script>
(function(){
'use strict';
const $ = (s,el=document)=>el.querySelector(s);
const $$ = (s,el=document)=>Array.from(el.querySelectorAll(s));
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const CBY = Object.fromEntries(COURSES.map(c=>[c.id,c]));
const cvar = id => `var(--c-${CBY[id]?id:'other'})`;
const view = $('#view');
const IC = {
  home:'<path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
  cal:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
  wrong:'<circle cx="12" cy="12" r="9"/><path d="m9 9 6 6M15 9l-6 6"/>',
  book:'<path d="M4 5a2 2 0 0 1 2-2h14v15H6a2 2 0 0 0-2 2z"/><path d="M4 20a2 2 0 0 0 2 1h14v-3"/><path d="M8 7h8"/>',
  cards:'<rect x="3" y="7" width="13" height="14" rx="2"/><path d="M8 3h11a2 2 0 0 1 2 2v12"/>',
  test:'<rect x="4" y="3" width="16" height="18" rx="2"/><path d="m8.5 12 2.5 2.5 4.5-5"/>',
  bolt:'<path d="M13 2 4 14h7l-1 8 9-12h-7z"/>',
  calc:'<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 7h8M8 12h.01M12 12h.01M16 12h.01M8 16h.01M12 16h.01M16 16h.01"/>',
  menu:'<path d="M4 6h16M4 12h16M4 18h16"/>',
  search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/>',
  sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
  moon:'<path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/>',
  auto:'<circle cx="12" cy="12" r="8.5"/><path d="M12 3.5a8.5 8.5 0 0 1 0 17z" fill="currentColor"/>',
  focus:'<path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/>',
  pen:'<path d="M4 20h4L19 9l-4-4L4 16z"/><path d="m13.5 6.5 4 4"/>',
  timer:'<circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9 2h6"/>',
  spark:'<path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5 18 18M6 18l2.5-2.5M15.5 8.5 18 6"/>'
};
const ic = n => `<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[n]}</svg>`;

/* ================= DURUM VE KAYIT ================= */
const LS = 'vize-masasi-v1';
const blank = () => ({v:1,upd:0,done:{},chk:{},plan:{},quiz:{},wrong:{},box:{},pomo:{},ans:{},kl:{},fb:{},last:null});
let AI = null; // sayfa içinden Claude'a sorma (sample); yoksa düğme gizlenir
let S = blank();
try{ const raw = localStorage.getItem(LS); if(raw) S = Object.assign(blank(), JSON.parse(raw)); }catch(e){}
let dbRef = null, saving = false, pending = false, pushTimer = null;
function setSync(ok, txt){ const el=$('#sync'); if(!el) return; el.className='sync'+(ok?' ok':''); el.querySelector('span').textContent = txt; }
function save(){
  S.upd = Date.now();
  try{ localStorage.setItem(LS, JSON.stringify(S)); }catch(e){}
  clearTimeout(pushTimer); pushTimer = setTimeout(push, 1200);
}
function push(){
  if(!dbRef) return;
  if(saving){ pending = true; return; }
  saving = true;
  dbRef.set(JSON.parse(JSON.stringify(S)))
    .then(()=>setSync(true,'Hesabına kaydedildi'))
    .catch(()=>setSync(false,'Sadece bu cihazda kayıtlı'))
    .finally(()=>{ saving=false; if(pending){ pending=false; push(); } });
}
async function initSync(){
  const t0 = Date.now();
  while(!(window.claude && window.claude.use)){ if(Date.now()-t0>10000) return; await new Promise(r=>setTimeout(r,200)); }
  window.claude.use('sample').then(f=>{ AI = f || null; if(AI && parseHash().tab==='klasik') route(); }).catch(()=>{});
  try{
    const user = await window.claude.use('user');
    const db = await window.claude.use('db');
    if(!user || !db) return;
    const id = await user.id();
    if(!id) return;
    dbRef = db.doc('data/users/'+id+'/state');
    const snap = await dbRef.get();
    if(snap.exists){
      const d = snap.data() || {};
      if((d.upd||0) > (S.upd||0)){ S = Object.assign(blank(), JSON.parse(JSON.stringify(d))); try{localStorage.setItem(LS, JSON.stringify(S));}catch(e){} route(); }
      else if((S.upd||0) > (d.upd||0)) push();
    } else if(S.upd) push();
    setSync(true,'Hesabına kaydediliyor');
  }catch(e){ setSync(false,'Sadece bu cihazda kayıtlı'); }
}

/* ================= TARİH YARDIMCILARI ================= */
const pad = n => String(n).padStart(2,'0');
const dkey = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const pdate = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y,m-1,d); };
const fmtDay = d => `${DAYNAMES[d.getDay()]} ${d.getDate()} ${MONTHS[d.getMonth()]}`;
const fmtExam = s => { const d=new Date(s); return `${fmtDay(d)} · ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
function left(s){
  const ms = new Date(s) - new Date();
  if(ms <= 0) return {past:true, txt:'tamamlandı', ms};
  const m = Math.floor(ms/60000), d = Math.floor(m/1440), h = Math.floor((m%1440)/60), mm = m%60;
  return {past:false, ms, d, h, m:mm, txt: d>0 ? `${d} gün ${h} sa` : (h>0 ? `${h} sa ${mm} dk` : `${mm} dk`)};
}
const allExams = () => [...COURSES.map(c=>({id:c.id,name:c.name,exam:c.exam,course:true})), ...OTHER_EXAMS.map(o=>({...o,course:false}))].sort((a,b)=>new Date(a.exam)-new Date(b.exam));
const nextExam = () => allExams().find(e=>!left(e.exam).past);

/* ================= NOT DİLİ (mini markdown) ================= */
function inline(s){
  const math=[];
  s = s.replace(/\\\((.+?)\\\)/g, m => { math.push(m); return '\u0001'+(math.length-1)+'\u0001'; });
  s = esc(s);
  s = s.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
       .replace(/(^|[\s(“])\*(?!\s)([^*]+?)\*(?=[\s).,;:”]|$)/g,'$1<em>$2</em>')
       .replace(/`([^`]+)`/g,'<code>$1</code>');
  return s.replace(/\u0001(\d+)\u0001/g,(m,i)=>esc(math[+i]));
}
const plain = s => s.replace(/\*\*|\\\(|\\\)|`/g,'').replace(/\*/g,'');
const PARSED = {};
function parseNotes(cid, src, kind){
  const key = cid+':'+kind; if(PARSED[key]) return PARSED[key];
  const L = src.replace(/\r/g,'').split('\n');
  let h='', secs=[], cur=null, sn=0, cn=0, i=0;
  const addText = t => { if(cur) cur.text += ' '+plain(t); };
  const closeSec = () => { if(cur){ if(kind==='n') h += `<div class="sec-f"><button class="btn sm" data-donenext="${cur.id}">Bitirdim, sıradaki konu →</button></div>`; h+='</section>'; } };
  while(i < L.length){
    const raw = L[i], t = raw.trim();
    if(!t){ i++; continue; }
    if(t.startsWith('## ')){
      closeSec();
      const id = kind==='n' ? `${cid}-s${sn++}` : `${cid}-o${sn++}`, title = t.slice(3);
      cur = {id, title: plain(title), text:''}; secs.push(cur);
      h += `<section class="sec" id="${id}" data-sec="${id}"><div class="sec-h"><h2>${inline(title)}</h2>${kind==='n'?`<button class="donebtn" data-done="${id}" aria-pressed="false">Bitirdim</button>`:''}</div>`;
      i++; continue;
    }
    if(t.startsWith('### ')){ h += `<h4>${inline(t.slice(4))}</h4>`; addText(t.slice(4)); i++; continue; }
    if(t.startsWith('|')){
      const rows=[];
      while(i < L.length && L[i].trim().startsWith('|')){ rows.push(L[i].trim().slice(1).split('|')); i++; }
      const n = Math.max(...rows.map(r=>r.length));
      let tb = n>=4 ? `<div class="tw"><table class="wide" style="--tmin:${Math.min(n,6)*8.5}em">` : '<div class="tw"><table>';
      rows.forEach((r,ri)=>{
        while(r.length<n) r.push('');
        tb += '<tr>' + r.map(c=>{ const ind=/^\s{3,}\S/.test(c); const tag=ri===0?'th':'td'; addText(c); return `<${tag}${ind?' class="ind"':''}>${inline(c.trim())}</${tag}>`; }).join('') + '</tr>';
        if(ri===0) tb = tb.replace(/<tr>(?=[^]*$)/,'<thead><tr>') + '</thead><tbody>';
      });
      h += tb + '</tbody></table></div>'; continue;
    }
    if(/^\s*(- |\d+\. )/.test(raw)){
      const items=[];
      while(i < L.length && /^\s*(- |\d+\. )/.test(L[i])){
        const m = L[i].match(/^(\s*)(- |\d+\. )(.*)$/);
        items.push({lvl: m[1].length>=2?1:0, ord: m[2]!=='- ', text:m[3]}); addText(m[3]); i++;
      }
      const st=[]; let lh='';
      items.forEach(it=>{
        while(st.length > it.lvl+1){ lh += '</li></'+st.pop()+'>'; }
        if(st.length === it.lvl+1) lh += '</li>';
        else { const tag = it.ord?'ol':'ul'; lh += '<'+tag+'>'; st.push(tag); }
        lh += '<li>'+inline(it.text);
      });
      while(st.length) lh += '</li></'+st.pop()+'>';
      h += lh; continue;
    }
    if(t.startsWith('$$')){ const m = t.replace(/^\$\$\s*/,'').replace(/\s*\$\$$/,''); h += `<div class="mathb">\\[${esc(m)}\\]</div>`; i++; continue; }
    const co = t.match(/^!(tuzak|ipucu|not|ek)\s+(.*)$/);
    if(co){ const lab={tuzak:'Dikkat',ipucu:'İpucu',not:'Not',ek:'Eklendi'}[co[1]]; h += `<div class="co ${co[1]}"><span class="cl">${lab}</span>${inline(co[2])}</div>`; addText(co[2]); i++; continue; }
    if(t.startsWith('!oz ')){ const items = t.slice(4).split(' | '); h += `<div class="oz"><span class="cl">Özünde</span><ul>${items.map(x=>`<li>${inline(x)}</li>`).join('')}</ul></div>`; addText(items.join(' ')); i++; continue; }
    if(t.startsWith('!sinav ')){ h += `<div class="sinav"><span class="cl">Sınavda böyle sorulur</span><p>${inline(t.slice(7))}</p>${CBY[cid] && KL[cid] ? `<a href="#${cid}-klasik" class="btn sm">Klasik sorularla çalış →</a>` : ''}</div>`; addText(t.slice(7)); i++; continue; }
    if(t.startsWith('+++ ')){ h += `<details class="rv dt"><summary><span class="dtl">Detay</span>${inline(t.slice(4))}</summary><div>`; addText(t.slice(4)); i++; continue; }
    if(t.startsWith('>>> ')){ h += `<details class="rv"><summary>${inline(t.slice(4))}</summary><div>`; i++; continue; }
    if(t === '<<<'){ h += '</div></details>'; i++; continue; }
    if(t.startsWith('?? ')){ const [q,a] = t.slice(3).split(' || '); h += `<details class="rv"><summary>${inline(q)}</summary><div><p>${inline(a||'')}</p></div></details>`; addText(q+' '+(a||'')); i++; continue; }
    if(t.startsWith('[] ')){ const id=`${cid}-c${cn++}`; h += `<label class="chk"><input type="checkbox" data-chk="${id}"><span>${inline(t.slice(3))}</span></label>`; addText(t.slice(3)); i++; continue; }
    if(t.startsWith('@fig ')){ const [nm,cap] = t.slice(5).split(' | '); const f = FIGS[nm.trim()]; h += f ? `<figure class="fig">${f()}${cap?`<figcaption>${esc(cap)}</figcaption>`:''}</figure>` : ''; if(cap) addText(cap); i++; continue; }
    h += `<p>${inline(t)}</p>`; addText(t); i++;
  }
  closeSec();
  return PARSED[key] = {html:h, secs};
}
const notes = cid => parseNotes(cid, $('#n-'+cid).textContent, 'n');
const ozet  = cid => parseNotes(cid, $('#o-'+cid).textContent, 'o');

/* ================= İLERLEME HESABI ================= */
function prog(cid){
  const secs = notes(cid).secs, done = secs.filter(s=>S.done[s.id]).length;
  const cards = FC[cid]||[], known = cards.filter((_,i)=>(S.box[cid+'-k'+i]||0)>=2).length;
  const q = S.quiz[cid]||{}, wrong = Object.keys(S.wrong).filter(k=>k.startsWith(cid+'-')).length;
  const kl = KL[cid]||[], klDone = kl.filter((_,i)=>S.kl[cid+'-q'+i]).length;
  const klScore = kl.length ? kl.reduce((a,x,i)=>{ const g=S.kl[cid+'-q'+i]; return a + (g ? g.length/x.k.length : 0); },0)/kl.length : 0;
  const pct = kl.length
    ? Math.round(100*(0.4*done/secs.length + 0.15*known/Math.max(1,cards.length) + 0.15*((q.best||0)/100) + 0.3*klScore))
    : Math.round(100*(0.5*done/secs.length + 0.25*known/Math.max(1,cards.length) + 0.25*((q.best||0)/100)));
  return {done, total:secs.length, known, cards:cards.length, best:q.best, att:q.att||0, wrong, pct, kl:kl.length, klDone, klScore:Math.round(100*klScore)};
}
// Ders sekmeleri: klasik sınavı olan derslerde Klasik ikinci sırada
function tabsFor(c){
  const t = [['','Konu anlatımı','book',notes(c.id).secs.length,'Konu']];
  if(KL[c.id] && KL[c.id].length) t.push(['klasik','Klasik','pen',KL[c.id].length,'Klasik']);
  t.push(['test','Test','test',(QZ[c.id]||[]).length,'Test'],['kart','Kartlar','cards',(FC[c.id]||[]).length,'Kartlar'],['ozet','Son tekrar','bolt',null,'Özet']);
  if(c.tool) t.push(['arac',c.tool,'calc',null,'Araç']);
  return t;
}

/* ================= MATH ================= */
function typeset(el){ if(window.MathJax && MathJax.typesetPromise){ MathJax.typesetPromise([el]).catch(()=>{}); } }
window.__vmTypeset = () => typeset(view);

/* ================= KENAR ÇUBUĞU ================= */
function renderSide(r){
  const sorted = [...COURSES].sort((a,b)=>new Date(a.exam)-new Date(b.exam));
  let h = `<a class="nav-a${r.v==='home'?' act':''}" href="#">${ic('home')}<span class="nm">Bugün</span></a>`;
  h += `<a class="nav-a${r.v==='takvim'?' act':''}" href="#takvim">${ic('cal')}<span class="nm">Takvim ve plan</span></a>`;
  const wc = Object.keys(S.wrong).length;
  h += `<a class="nav-a${r.v==='yanlis'?' act':''}" href="#yanlis">${ic('wrong')}<span class="nm">Yanlış defteri</span>${wc?`<span class="pc">${wc}</span>`:''}</a>`;
  h += `<h6>Dersler · sınav sırası</h6>`;
  sorted.forEach(c=>{
    const p = prog(c.id), l = left(c.exam), act = r.cid===c.id;
    h += `<a class="nav-a${act?' act':''}" href="#${c.id}" style="--c:${cvar(c.id)}"><span class="dot"></span><span class="nm">${esc(c.name)}<small>${l.past?'Sınav bitti':fmtExam(c.exam)}</small><span class="mini-bar"><i style="width:${p.pct}%"></i></span></span><span class="pc">%${p.pct}</span></a>`;
    if(act){
      h += `<div class="sub-nav" style="--c:${cvar(c.id)}">` + tabsFor(c).map(([k,n])=>`<a href="#${c.id}${k?'-'+k:''}" class="${(r.tab||'')===k?'act':''}">${k==='arac'?'Araç':esc(n)}</a>`).join('') + `</div>`;
    }
  });
  h += `<h6>Malzemesi olmayan sınavlar</h6>` + OTHER_EXAMS.map(o=>`<div class="nav-a" style="--c:var(--c-other);cursor:default"><span class="dot"></span><span class="nm">${esc(o.name)}<small>${fmtExam(o.exam)}</small></span></div>`).join('');
  h += `<div class="sync" id="sync"><i></i><span>${dbRef?'Hesabına kaydediliyor':'Bu cihazda kayıtlı'}</span></div>`;
  $('#side').innerHTML = h;
}

/* ================= ANA SAYFA ================= */
function planFor(k){ return (PLAN[k]||[]).map((p,i)=>({k:k+'-'+i, cid:p[0], text:p[1], go:p[2]})); }
function taskHTML(t){
  const c = CBY[t.cid], done = !!S.plan[t.k];
  return `<div class="task${done?' done':''}" style="--c:${cvar(t.cid)}"><input type="checkbox" id="t-${t.k}" data-plan="${t.k}"${done?' checked':''}><label for="t-${t.k}"><span class="tag">${esc(c?c.short:'')}</span>${esc(t.text)}</label><a href="#${t.go}">Aç →</a></div>`;
}
const meter = (n,a,b) => `<div class="meter"><span>${n}</span><span class="bar"><i style="width:${b?100*a/b:0}%"></i></span><b>${a}/${b}</b></div>`;
const nextSec = cid => notes(cid).secs.find(s=>!S.done[s.id]);
function viewHome(){
  const now = new Date(), tk = dkey(now), ne = nextExam(), nc = ne && CBY[ne.id];
  const keys = Object.keys(PLAN).sort();
  let dayKey = tk, label = 'Bugünün planı';
  if(!PLAN[tk]){ const nx = keys.find(k=>k>tk); if(nx){ dayKey = nx; label = `${fmtDay(pdate(nx))} planı`; } else dayKey = null; }
  let h = `<div class="wrap wide"><div class="eyebrow" style="margin-bottom:10px">${fmtDay(now)}${S.pomo[tk]?` · bugün ${S.pomo[tk]} odak turu`:''}</div>`;
  allExams().filter(e=>{ const l=left(e.exam); return !l.past && l.ms < 36*3600e3; }).forEach(e=>{
    h += `<div class="alert" style="margin-bottom:12px"><b>Yaklaşan sınav:</b> ${esc(e.name)} · ${fmtExam(e.exam)} (${left(e.exam).txt} kaldı)${e.course?` · <a href="#${e.id}-ozet">Son tekrar sayfası →</a>`:''}</div>`; });
  h += `<div class="hero">`;
  if(ne){
    const l = left(ne.exam);
    h += `<section class="nextx" style="--c:${cvar(ne.id)}"><div class="eyebrow">Sıradaki sınav</div><h1>${esc(ne.name)}</h1><div class="when">${fmtExam(ne.exam)}</div>
      <div class="cd" data-cd="${ne.exam}" aria-label="Kalan süre"><div><b data-p="d">${l.d}</b><small>gün</small></div><div><b data-p="h">${l.h}</b><small>saat</small></div><div><b data-p="m">${l.m}</b><small>dakika</small></div></div><div class="go">`;
    if(nc){ const nx = nextSec(nc.id); h += `<a class="btn cc" href="#${nx?nx.id:nc.id+'-ozet'}">${ic('book')}${nx?'Sıradaki konu':'Son tekrar'}</a><a class="btn" href="#${nc.id}-test">${ic('test')}Test çöz</a><a class="btn" href="#${nc.id}-kart">${ic('cards')}Kartlar</a>`; }
    else h += `<span class="muted" style="font-size:13px">Bu sınav için sitede malzeme yok.</span>`;
    h += `</div></section>`;
  } else h += `<section class="nextx" style="--c:var(--accent)"><h1>Tüm sınavlar bitti</h1><div class="when">Geçmiş olsun!</div></section>`;
  h += `<section class="card planc"><div class="hd"><h2>${label}</h2>`;
  if(dayKey){
    const ts = planFor(dayKey), dn = ts.filter(t=>S.plan[t.k]).length;
    h += `<span class="mono muted" style="font-size:12px">${dn}/${ts.length} tamam</span></div><div class="pbar"><i style="width:${ts.length?100*dn/ts.length:0}%"></i></div>` + ts.map(taskHTML).join('');
    if(PLAN_NOTES[dayKey]) h += `<p class="muted" style="font-size:13px;margin:8px 0 0">${esc(PLAN_NOTES[dayKey])}</p>`;
  } else h += `</div><p class="muted">Plan tamamlandı.</p>`;
  h += `<div class="foot"><a href="#takvim">Tüm plan →</a>${S.last&&S.last.h?`<a href="#${esc(S.last.h)}">Kaldığın yerden devam →</a>`:''}</div></section></div>`;
  h += `<div class="shead"><h2>Sınav haftası</h2><a href="#takvim">Takvimi aç →</a></div><div class="week">`;
  for(let i=0;i<12;i++){
    const d = pdate('2026-11-09'); d.setDate(d.getDate()+i); const k = dkey(d);
    const ex = allExams().filter(e=>e.exam.startsWith(k)), ts = planFor(k);
    h += `<a class="wd${k===tk?' today':''}${k<tk?' past':''}${ex.length?' exams':''}" href="#takvim"><div class="n"><span>${DAYNAMES[d.getDay()]}</span>${k===tk?'<span>bugün</span>':''}</div><div class="d">${d.getDate()}</div>`
      + ex.map(e=>`<div class="wx" style="--c:${cvar(e.id)}">${esc(CBY[e.id]?CBY[e.id].short:e.name)}<small>${e.exam.slice(11)}</small></div>`).join('')
      + `<div class="wdots">${ts.map(t=>`<i class="${S.plan[t.k]?'f':''}" style="--c:${cvar(t.cid)}" title="${esc(CBY[t.cid].short+': '+t.text)}"></i>`).join('')}</div></a>`;
  }
  h += `</div><div class="shead"><h2>Dersler</h2><span class="muted" style="font-size:13px">sınav sırasıyla</span></div><div class="courses2">`;
  [...COURSES].sort((a,b)=>new Date(a.exam)-new Date(b.exam)).forEach(c=>{

function startQuiz(cid, mode){
  const all = QZ[cid]||[], pr = quizPrefs[cid] || {n:'10', t:'', ord:'mix'};

function fmtFb(t){
  let h = '', inL = false;
  t.split('\n').forEach(x=>{
    const s = x.trim();
    if(!s){ if(inL){ h+='</ul>'; inL=false; } return; }
    if(/^[-*•] /.test(s)){ if(!inL){ h+='<ul>'; inL=true; } h += '<li>'+inline(s.slice(2))+'</li>'; return; }
    if(inL){ h+='</ul>'; inL=false; }
    h += /^#+ /.test(s) ? '<h4>'+inline(s.replace(/^#+ /,''))+'</h4>' : '<p>'+inline(s)+'</p>';
  });
  return h + (inL?'</ul>':'');
}

function startExam(cid){
  const L = KL[cid], all = L.map((_,i)=>i);

  let ids = pr.length ? [...th.slice(0,3), ...pr.slice(0,2)] : th.slice(0,5);
  if(ids.length<5) ids = [...ids, ...shuffle(all.filter(i=>!ids.includes(i)))].slice(0,5);
  KX = {cid, ids, start:Date.now(), dur:50*60*1000, done:false}; KS = null;
  route(); window.scrollTo(0,0);
  clearInterval(klTimer);

    if(!KX || KX.done){ clearInterval(klTimer); return; }
    const rem = KX.start + KX.dur - Date.now(), el = $('#ktimer b');
    if(el) el.textContent = fmtMs(Math.max(0,rem));

}

// Türkçe sayı: "10.000" binlik, "7,2" ondalık, "1.5" ondalık
const parseNum = raw => { let v = String(raw==null?'':raw).trim().replace(/\s/g,''); if(!v) return NaN; if(v.includes(',')) v = v.replace(/\./g,'').replace(',','.'); else if(/^-?\d{1,3}(\.\d{3})+$/.test(v)) v = v.replace(/\./g,''); return parseFloat(v); };
const num = id => parseNum(($('#'+id)||{}).value);
const numD = num;
function calcEq(){
  const A=num('eqA'), Lb=num('eqL'), E=num('eqE'), out=$('#eqOut'); if(!out) return;
  let r='';
  if(isNaN(A)&&!isNaN(Lb)&&!isNaN(E)) r=`<div><small>Assets = L + OE</small><b>${nf(Lb+E,0)}</b></div>`;
  else if(isNaN(Lb)&&!isNaN(A)&&!isNaN(E)) r=`<div><small>Liabilities = A − OE</small><b>${nf(A-E,0)}</b></div>`;
  else if(isNaN(E)&&!isNaN(A)&&!isNaN(Lb)) r=`<div><small>Owner's Equity = A − L</small><b>${nf(A-Lb,0)}</b></div>`;
  else if(!isNaN(A)&&!isNaN(Lb)&&!isNaN(E)) r=`<div><small>Denge</small><b>${Math.abs(A-Lb-E)<1e-9?'✓ A = L + OE':'✗ fark '+nf(A-Lb-E,0)}</b></div>`;
  else r=`<div><small>Sonuç</small><b>İki değer gir</b></div>`;
  out.innerHTML = r;
}
function calcEl(){
  const P1=numD('eP1'),P2=numD('eP2'),Q1=numD('eQ1'),Q2=numD('eQ2'), out=$('#eOut'); if(!out) return;
  if([P1,P2,Q1,Q2].some(isNaN) || P1===P2){ out.innerHTML='<div><small>Sonuç</small><b>Dört değeri gir (P₁ ≠ P₂)</b></div>'; return; }
  const pq=(Q2-Q1)/Q1, pp=(P2-P1)/P1, mq=(Q2-Q1)/((Q1+Q2)/2), mp=(P2-P1)/((P1+P2)/2);
  const Ep=Math.abs(pq/pp), Em=Math.abs(mq/mp);
  const cls = e => e<1e-9?'tam inelastik':Math.abs(e-1)<0.005?'birim esnek':e<1?'inelastik':'elastik';
  const TR1=P1*Q1, TR2=P2*Q2;
  out.innerHTML = `<div><small>%ΔQ (orta nokta)</small><b>${nf(mq*100,1)}%</b></div><div><small>%ΔP (orta nokta)</small><b>${nf(mp*100,1)}%</b></div><div><small>E (orta nokta)</small><b>${nf(Em,2)} · ${cls(Em)}</b></div><div><small>E (yüzde değişim)</small><b>${nf(Ep,2)} · ${cls(Ep)}</b></div><div><small>Toplam gelir P×Q</small><b>${nf(TR1,0)} → ${nf(TR2,0)}</b></div><div><small>Gelir değişimi</small><b>${TR2>TR1?'arttı':TR2<TR1?'azaldı':'değişmedi'}</b></div>`;
}
function calcFin(){

  const r=j/m, n=Math.round(y*m*1e6)/1e6;

  const labels={fv:'Anapara (P)',pv:'Gelecek tutar (S)',apv:'Dönemlik ödeme (R)',afv:'Dönemlik ödeme (R)',pmt:'Kredi tutarı (A)',sink:'Hedef birikim (S)',cfv:'Anapara (P)',cpv:'Gelecek tutar (S)',eff:'—',time:'Anapara (P)',perp:'Dönemlik ödeme (R)'};

  $('#fAmt2W').hidden = mode!=='time'; $('#fYW').hidden = ['eff','time','perp'].includes(mode); $('#fDueW').hidden = !['apv','afv'].includes(mode);
  $('#fAmt').disabled = mode==='eff';
  const cont = mode==='cfv'||mode==='cpv';
  let rows = cont ? [['r (yıllık)',nf(j*100,4)+'%'],['t (yıl)',nf(y,2)]] : [['r = j / m',nf(r,6)],['n = yıl × m',nf(n,0)]];
  let res='', form='';
  if(mode==='fv'){ res=amt*Math.pow(1+r,n); form='S = P(1+r)ⁿ'; rows.push(['Faiz (S − P)',nf(res-amt)]); }
  if(mode==='pv'){ res=amt*Math.pow(1+r,-n); form='P = S(1+r)⁻ⁿ'; }
  if(mode==='apv'){ res= due? amt*(1+a(n-1,r)) : amt*a(n,r); form= due?'A = R(1 + a(n−1,r))':'A = R·a(n,r)'; rows.push(['a(n,r)',nf(a(n,r),6)]); }
  if(mode==='afv'){ res= due? amt*(s(n+1,r)-1) : amt*s(n,r); form= due?'S = R(s(n+1,r) − 1)':'S = R·s(n,r)'; rows.push(['s(n,r)',nf(s(n,r),6)]); }
  if(mode==='pmt'){ res=amt/a(n,r); form='R = A / a(n,r)'; rows.push(['Toplam ödeme (nR)',nf(res*n)],['Toplam faiz (nR − A)',nf(res*n-amt)],['1. ay faiz / anapara',nf(amt*r)+' / '+nf(res-amt*r)]); }
  if(mode==='sink'){ res=amt/s(n,r); form='R = S / s(n,r)'; rows.push(['Toplam yatırılan',nf(res*n)]); }
  if(mode==='cfv'){ res=amt*Math.exp(j*y); form='S = Pe^(rt)'; }
  if(mode==='cpv'){ res=amt*Math.exp(-j*y); form='P = Se^(−rt)'; }
  if(mode==='eff'){ res=null; rows=[['Nominal',nf(j*100,4)+'%'],['Efektif (m = '+m+')',nf((Math.pow(1+r,m)-1)*100,4)+'%'],['Efektif (sürekli)',nf((Math.exp(j)-1)*100,4)+'%']]; form='rₑ = (1 + j/m)ᵐ − 1'; }
  if(mode==='time'){ const nn=Math.log(amt2/amt)/Math.log(1+r); res=null; rows=[['r',nf(r,6)],['Dönem sayısı n',nf(nn,4)],['Yıl',nf(nn/m,4)]]; form='n = ln(S/P) / ln(1+r)'; }
  if(mode==='perp'){ res=amt/r; form='A = R / r'; rows=[['r = j / m',nf(r,6)]]; }
  out.innerHTML = rows.map(([k,v])=>`<div><small>${k}</small><b>${v}</b></div>`).join('') + (res!=null?`<div style="background:var(--accent-soft)"><small>Sonuç · ${form}</small><b>${nf(res)}</b></div>`:`<div style="background:var(--accent-soft)"><small>Formül</small><b style="font-size:15px">${form}</b></div>`);
}

/* ================= ARAMA ================= */
const norm = s => s.toLocaleLowerCase('tr').replace(/[ıİ]/g,'i').replace(/ş/g,'s').replace(/ğ/g,'g').replace(/ü/g,'u').replace(/ö/g,'o').replace(/ç/g,'c').replace(/â/g,'a').replace(/î/g,'i');
let INDEX = null;
function buildIndex(){
  INDEX = [];
  COURSES.forEach(c=>{
    notes(c.id).secs.forEach(s=>INDEX.push({cid:c.id, title:s.title, sub:'Konu', text:s.text, go:s.id}));
    (FC[c.id]||[]).forEach((k,i)=>INDEX.push({cid:c.id, title:k[0], sub:'Kart', text:k[1], go:c.id+'-kart', card:i}));
    (KL[c.id]||[]).forEach((q,i)=>INDEX.push({cid:c.id, title:plain(q.q.split('\n')[0]).slice(0,90), sub:'Klasik', text:plain(q.a.replace(/\|/g,' ')), go:c.id+'-klasik', kq:i}));
  });
  INDEX.forEach(x=>x.n = norm(x.title+' '+x.text));
}
let resSel = -1, resList = [];
function doSearch(q){
  const box = $('#results'); const terms = norm(q).split(/\s+/).filter(t=>t.length>1);
  if(!terms.length){ box.hidden = true; return; }
  if(!INDEX) buildIndex();
  resList = INDEX.map(x=>{ if(!terms.every(t=>x.n.includes(t))) return null; let sc = 0; const nt = norm(x.title); terms.forEach(t=>{ if(nt.includes(t)) sc+=5; }); if(x.sub==='Kart') sc+=1; return {x, sc}; }).filter(Boolean).sort((a,b)=>b.sc-a.sc).slice(0,14).map(o=>o.x);
  resSel = -1;
  if(!resList.length){ box.innerHTML = `<div class="empty" style="padding:14px">“${esc(q)}” için sonuç yok.</div>`; box.hidden = false; return; }
  box.innerHTML = resList.map((x,i)=>{
    const t = x.text, nt = norm(t), p = nt.indexOf(terms[0]); const st = Math.max(0,p-50);
    let snip = esc((st?'…':'')+t.slice(st, st+170));
    const re = new RegExp('('+esc(t.slice(p, p+terms[0].length)).replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','i');
    if(p>=0) snip = snip.replace(re,'<mark>$1</mark>');
    return `<button data-ri="${i}" style="--c:${cvar(x.cid)}"><div class="rt"><span class="dot"></span> ${esc(x.title)} <span class="pill">${esc(CBY[x.cid].short)} · ${x.sub}</span></div><div class="rs">${snip}</div></button>`;
  }).join('');
  box.hidden = false;
}
function openResult(i){
  const x = resList[i]; if(!x) return;
  $('#results').hidden = true; $('#q').blur();
  if(x.card!=null){ FS = {cid:x.cid, filter:'all', order:deck(x.cid,'all'), i:x.card, flip:false}; }
  if(x.kq!=null){ KS = {cid:x.cid, i:x.kq}; KX = null; }
  if(location.hash === '#'+x.go) route(); else location.hash = x.go;
}

/* ================= YÖNLENDİRME ================= */
function parseHash(){
  const h = decodeURIComponent(location.hash.slice(1));
  if(!h) return {v:'home'};
  if(h==='takvim'||h==='yanlis') return {v:h};
  let m = h.match(/^([a-z]+)-s(\d+)$/); if(m && CBY[m[1]]) return {v:'course', cid:m[1], tab:'', jump:h};
  m = h.match(/^([a-z]+)(?:-(kart|test|ozet|arac|klasik))?$/); if(m && CBY[m[1]]) return {v:'course', cid:m[1], tab:m[2]||''};
  return {v:'home'};
}
let lastRouteKey = '';
function route(){
  const r = parseHash(), c = CBY[r.cid];
  const key = r.v+(r.cid||'')+(r.tab||'');
  if(r.v==='home') viewHome();
  else if(r.v==='takvim') viewCal();
  else if(r.v==='yanlis') viewWrong();
  else if(c){
    if(r.tab==='kart') viewCards(c);
    else if(r.tab==='test') viewQuiz(c);
    else if(r.tab==='ozet') viewOzet(c);
    else if(r.tab==='arac' && c.tool) viewTool(c);
    else if(r.tab==='klasik' && KL[c.id]) viewKlasik(c);
    else viewNotes(c, r.jump);
    if(location.hash.length>1){ S.last = {h: location.hash.slice(1)}; try{localStorage.setItem(LS, JSON.stringify(S));}catch(e){} }
  }
  renderSide(r);
  renderBbar(r);
  const rp = $('#readprog'); rp.hidden = !(c && (r.tab==='' || r.tab==='ozet')); if(c) rp.style.setProperty('--c', cvar(c.id));
  document.body.classList.remove('search-open');
  if(key!==lastRouteKey && !r.jump){ window.scrollTo(0,0); }
  updateReadProg();
  lastRouteKey = key;
  document.body.classList.remove('nav-open'); $('#menuBtn').setAttribute('aria-expanded','false');
}

  if(t.matches('input[data-key]')){
    const id = d.key, j = +d.j, g = new Set(S.kl[id]||[]); t.checked ? g.add(j) : g.delete(j); S.kl[id] = [...g].sort((a,b)=>a-b); save();
    const [cid, qi] = [id.split('-q')[0], +id.split('-q')[1]], n = KL[cid][qi].k.length, ks = $('#ks-'+id);

    if(KX && KX.done){ const a=$('#kxavg'); if(a) a.textContent = '%'+Math.round(KX.ids.reduce((s,i)=>s+(klScoreOf(KX.cid,i)||0),0)/KX.ids.length); }
    return;
  }
  if(d.donenext){
    const id = d.donenext, secs = notes(parseHash().cid).secs, ix = secs.findIndex(s=>s.id===id);
    if(!S.done[id]){ S.done[id]=1; save(); hydrate(view); renderSide(parseHash()); }
    const nx = secs.slice(ix+1).find(s=>!S.done[s.id]) || secs[ix+1];
    if(nx) scrollToSec(nx.id); else toast('Son konuyu da bitirdin. Şimdi Test sekmesiyle pekiştir.');
    return;
  }
  if(d.focus!==undefined){ const on=document.body.classList.toggle('focus'); setLS('vm-focus', on?'1':''); toast(on?'Odak modu açık: yan menü gizlendi.':'Odak modu kapalı.'); return; }
  if(d.menu!==undefined){ const o=document.body.classList.toggle('nav-open'); $('#menuBtn').setAttribute('aria-expanded',o); return; }
  if(d.fs){ setFs(+d.fs); return; }
  if(t.matches('input[data-chk]')){ t.checked ? S.chk[d.chk]=1 : delete S.chk[d.chk]; save(); return; }
  if(t.matches('input[data-plan]')){ t.checked ? S.plan[d.plan]=1 : delete S.plan[d.plan]; save(); const tk=t.closest('.task'); if(tk) tk.classList.toggle('done',t.checked); if(parseHash().v==='home') viewHome(); return; }
  if(t.id==='fc'){ if(swallowClick){ swallowClick=false; return; } FS.flip = !FS.flip; t.classList.toggle('flip', FS.flip); return; }
  if(d.ff){ FS.filter = d.ff; FS.order = deck(FS.cid, d.ff); FS.i = 0; FS.flip=false; route(); return; }
  if(d.shuffle!==undefined){ FS.order = shuffle(FS.order); FS.i=0; FS.flip=false; route(); toast('Kartlar karıştırıldı.'); return; }
  if(d.nav){ const n=FS.order.length; FS.i=(FS.i+(+d.nav)+n)%n; FS.flip=false; route(); return; }
  if(d.grade){ cardGrade(d.grade==='1'); return; }
  if(t.closest('[data-pref]') && d.v){ const seg=t.closest('[data-pref]'); const cid=parseHash().cid; quizPrefs[cid]=Object.assign({n:'10',t:'',ord:'mix'},quizPrefs[cid]); quizPrefs[cid][seg.dataset.pref]=d.v; $$('button',seg).forEach(b=>b.classList.toggle('act',b===t)); return; }
  if(d.start){ const cid=parseHash().cid; startQuiz(cid, d.start); return; }
  if(d.opt){ pick(+d.opt); return; }
  if(d.next!==undefined){ nextQ(); return; }
  if(d.quit!==undefined){ finishQuiz(); route(); return; }
  if(d.again!==undefined){ QS=null; route(); return; }
  if(d.wrongstart){ QS=null; location.hash = d.wrongstart+'-test'; setTimeout(()=>startQuiz(d.wrongstart,'wrong'),0); return; }
  if(d.dr){ if(DR.ans) return; DR.ans=d.dr; DR.n++; const dd=DR.cur, right=((dd.up===['A','E','D'].includes(dd.t))?'Dr':'Cr'); if(d.dr===right) DR.ok++; route(); return; }
  if(d.drnext!==undefined){ newDrill(); route(); return; }
  if(d.ri){ openResult(+d.ri); return; }
});

document.addEventListener('keydown', e=>{
  const inField = /INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName);
  if(e.key==='Escape'){ $('#results').hidden=true; document.body.classList.remove('nav-open','search-open'); if(inField) document.activeElement.blur(); return; }
  if(document.activeElement.id==='q'){
    const btns = $$('#results button');
    if(e.key==='ArrowDown'||e.key==='ArrowUp'){ e.preventDefault(); if(!btns.length) return; resSel=(resSel+(e.key==='ArrowDown'?1:-1)+btns.length)%btns.length; btns.forEach((b,i)=>b.classList.toggle('sel',i===resSel)); btns[resSel].scrollIntoView({block:'nearest'}); }
    if(e.key==='Enter'){ e.preventDefault(); openResult(resSel>=0?resSel:0); }
    return;
  }
  if(inField || e.metaKey || e.ctrlKey || e.altKey) return;
  if(e.key==='/'){ e.preventDefault(); $('#q').focus(); return; }
  if(e.key==='?'){ $('#help').showModal(); return; }
  const r = parseHash();
  if(r.tab==='kart' && FS && FS.order.length){
    if(e.key===' '){ e.preventDefault(); FS.flip=!FS.flip; const f=$('#fc'); if(f) f.classList.toggle('flip',FS.flip); }
    if(e.key==='ArrowRight'){ FS.i=(FS.i+1)%FS.order.length; FS.flip=false; route(); }
    if(e.key==='ArrowLeft'){ FS.i=(FS.i-1+FS.order.length)%FS.order.length; FS.flip=false; route(); }
    if(e.key==='1') cardGrade(false);
    if(e.key==='2') cardGrade(true);
  }
  if(r.tab==='test' && QS && !QS.done){
    const k = e.key.toLowerCase(), map = {a:0,b:1,c:2,d:3,e:4,'1':0,'2':1,'3':2,'4':3,'5':4};
    if(k in map && QS.picked==null){ const q=QZ[QS.cid][QS.list[QS.i]]; if(map[k]<q[3].length) pick(map[k]); }
    if(e.key==='Enter' && QS.picked!=null){ e.preventDefault(); nextQ(); }
  }
  if(r.tab==='arac' && r.cid==='acc'){
    if(!DR.ans && (e.key==='1'||e.key==='2')){ $(`[data-dr="${e.key==='1'?'Dr':'Cr'}"]`)?.click(); }
    else if(DR.ans && e.key==='Enter'){ newDrill(); route(); }
  }
});

let sw = null, swallowClick = false;
document.addEventListener('pointerdown', e=>{ const f = e.target.closest('#fc'); if(!f || e.button>0) return; sw = {x:e.clientX, y:e.clientY, f, dx:0, moved:false}; });
document.addEventListener('pointermove', e=>{
  if(!sw) return;
  sw.dx = e.clientX - sw.x; const dy = e.clientY - sw.y;
  if(!sw.moved && Math.abs(sw.dx) > 10 && Math.abs(sw.dx) > Math.abs(dy)){ sw.moved = true; sw.f.classList.add('drag'); }
  if(sw.moved){ sw.f.style.transform = `translateX(${sw.dx}px) rotate(${sw.dx/28}deg)`; sw.f.dataset.dir = sw.dx > 70 ? 'r' : sw.dx < -70 ? 'l' : ''; }
});
function endSwipe(){
  if(!sw) return; const s = sw; sw = null;
  s.f.classList.remove('drag'); s.f.dataset.dir = '';
  if(!s.moved) return;
  swallowClick = true; setTimeout(()=>{ swallowClick = false; }, 60);
  if(Math.abs(s.dx) > 90){ s.f.style.transform = `translateX(${s.dx>0?120:-120}%) rotate(${s.dx>0?14:-14}deg)`; setTimeout(()=>cardGrade(s.dx>0), 170); }
  else s.f.style.transform = '';
}
document.addEventListener('pointerup', endSwipe);

  pomoDraw();
}
pomoBtn.addEventListener('click', ()=>{ P.run=!P.run; clearInterval(P.t); if(P.run) P.t=setInterval(tick,1000); pomoDraw(); toast(P.run?'Odak sayacı başladı (25 dk). Çift tıkla sıfırla.':'Sayaç durdu.'); });
pomoBtn.addEventListener('dblclick', ()=>{ clearInterval(P.t); P.run=false; P.mode='work'; P.left=25*60; pomoDraw(); });
pomoBtn.addEventListener('contextmenu', e=>{ e.preventDefault(); clearInterval(P.t); P.run=false; P.mode='work'; P.left=25*60; pomoDraw(); toast('Sayaç sıfırlandı.'); });
pomoDraw();

/* ================= ÜST ÇUBUK GERİ SAYIMI, BİLDİRİM ================= */
function drawNext(){ const ne = nextExam(); $('#nextExam').innerHTML = ne ? `<span class="dot" style="--c:${cvar(ne.id)}"></span>${esc(ne.name)} · ${left(ne.exam).txt}` : 'Sınavlar bitti'; }
drawNext(); setInterval(drawNext, 30000);
let toastT = null;
function toast(m){ const t=$('#toast'); t.textContent=m; t.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>t.hidden=true, 2600); }

route();
initSync();
})();
</script>
