## Son tekrar: Mikroiktisat
- **On ilke = 4–3–3:** bireysel (trade-offs, opportunity cost, margin, incentives) · etkileşim (trade, markets, government) · bütün ekonomi (productivity, money→inflation, Phillips).
- **Efficiency** = pastayı büyütmek · **Equity** = adil bölmek.
- **Market failure:** externality + market power.
- **PPF:** üzerinde etkin, içinde etkin değil, dışında ulaşılamaz; dışa bükük = artan fırsat maliyeti; teknoloji dışa kaydırır.
- **Faktörler:** land, labour, capital. **Para faktör değildir.**
- **Dairesel akım:** hane emeği faktör piyasasında satar, malı mal piyasasında alır; iç döngü mal/faktör, dış döngü para.
- **Mutlak üstünlük** = daha az girdi · **Karşılaştırmalı** = daha düşük fırsat maliyeti.
| Değişen | Sonuç
| Malın kendi fiyatı | Eğri üzerinde hareket (quantity demanded/supplied)
| Gelir, ilişkili mal, zevk, beklenti, alıcı sayısı | Talep eğrisi kayar
| Girdi fiyatı ↑ | Arz sola · Teknoloji → arz sağa
- Fiyat > denge → **surplus**, fiyat düşer · Fiyat < denge → **shortage**, fiyat artar.
- İki eğri aynı yöne kayarsa **Q** kesin, ters yöne kayarsa **P** kesin.
$$ E = \frac{\Delta Q / \bar Q}{\Delta P / \bar P} \quad (\text{orta nokta}) $$
- Dikey = tam inelastik (0) · yatay = tam elastik (∞) · E > 1 elastik.
- Gelir esnekliği: normal +, düşük −, lüks > 1 · Çapraz: ikame +, tamamlayıcı −.
- Uzun dönemde hem arz hem talep daha elastik (OPEC örneği).

## Formül kâğıdı: İşletme Matematiği
**Önce:** r = yıllık oran / yıldaki dönem · n = yıl × yıldaki dönem.
$$ S = P(1+r)^n \qquad P = S(1+r)^{-n} \qquad r_e = \left(1+\tfrac{r}{m}\right)^m - 1 $$
$$ S = Pe^{rt} \qquad P = Se^{-rt} \qquad r_e = e^r - 1 $$
$$ a_{\overline{n}|r} = \frac{1-(1+r)^{-n}}{r} \qquad s_{\overline{n}|r} = \frac{(1+r)^n-1}{r} $$
| Durum | Formül
| Dönem sonu, bugünkü değer | A = R · a(n,r)
| Dönem sonu, gelecek değer | S = R · s(n,r)
| Dönem başı (due), bugünkü | A = R(1 + a(n−1,r))
| Dönem başı (due), gelecek | S = R(s(n+1,r) − 1)
| Kredi taksiti | R = A / a(n,r)
| Sinking fund | R = S / s(n,r)
| Kalan borç (k ödeme sonra) | R · a(n−k, r)
| Toplam faiz | nR − A
| Perpetuity | A = R / r
| Süre bulma | ln al: n = ln(S/P) / ln(1+r)
$$ x_{\text{tepe}} = -\frac{b}{2a} \qquad m = \frac{y_2-y_1}{x_2-x_1} \qquad \sum i = \frac{n(n+1)}{2} \qquad \sum i^2 = \frac{n(n+1)(2n+1)}{6} $$
$$ S_n^{\text{geo}} = \frac{a_1(1-r^n)}{1-r} \qquad S_n^{\text{arit}} = \frac{n}{2}(a_1+a_n) $$
- Denge: arz = talep · Başabaş: TR = TC · Vergi t: yeni arz = eski arz + t.
- f(x − c) sağa, f(x + c) sola · negatifle çarpınca eşitsizlik döner · log(m+n) açılmaz.
- Ara sonuçları yuvarlama; en sonda 2 basamak.

## Son tekrar: İşletmeye Giriş
- **Beceri × kademe:** conceptual üstte, technical altta, **human her kademede eşit**.
- **10 rol (3–3–4):** Informational (monitor, disseminator, spokesperson) · Interpersonal (figurehead, leader, liaison) · Decisional (entrepreneur, disturbance handler, resource allocator, negotiator; en önemli grup).
- **Girişimci:** en önemli özellik *being their own boss*; kaderi suçlayan = internal locus of control eksik.
- **Çevre:** general (political-legal, economic, demographic, socio-cultural, technological, international) · industry (customers, suppliers, competitors, substitutes, labor market).
- **Adapt** (organic, merger, JV) vs **Influence** (reklam/PR, lobi, trade associations). Belirsizlik yüksek → organic.
- **Ortak sayısı (kitap):** Ltd. 2–50, A.Ş. en az 5. Registered partnership: tüzel kişi ama sınırsız sorumluluk.
- **Merger** yeni kimlik · **JV** kimlik korunur · **Acquisition** → subsidiary · istenmeyen → hostile takeover.
- **Birleşme türü:** vertical (aynı zincir) · horizontal (aynı sektör) · conglomerate (ilgisiz).
- **Teslim:** EXW < FOB < CFR < CIF (CIF = navlun + sigorta). **Ödeme:** peşin ihracatçıya, open account/consignment ithalatçıya en iyi.
- **Küreselleşme:** exporting/importing (+countertrade) → contractual (franchising, licensing, subcontracting) → int'l investment (JV, overseas production, M&A).
- **Entegrasyon:** FTA → customs union (ortak dış tarife; Türkiye–AB 1996) → common market (emek+sermaye) → economic union.
- **Tariff** vergi · **quota** miktar · **embargo** yasak. GATT 1947 → WTO 1995.
- **Planlar:** strategic/tactical/operational · standing (policy, procedure, rule) vs single-use (program, project, budget).
- Geniş span → flat · dar span → tall · **matrix** iki amir, unity of command bozulur.
- **Liderlik:** trait · behavioral (autocratic, democratic, laissez-faire) · contingency.
- **Content:** Maslow (physiological → safety → social → esteem → self-actualization), Herzberg (hygiene vs motivators). **Process:** Vroom (E × I × V), Adams (equity).
- **Kontrol:** feedforward (önce) · concurrent (sırasında) · feedback (sonra). Grapevine = gayriresmi iletişim.
</script>

## Son tekrar: Hukuka Giriş
- Hukuku ayıran: **devlet gücüyle desteklenen maddi yaptırım**. Özellikler: genel, soyut, sürekli, yaptırımlı, bağlayıcı. Yapı: varsayım + hüküm.
- Objektif hukuk = kurallar bütünü · sübjektif = hak · pozitif = yürürlükteki · tabii = ideal.
- **Kıta Avrupası** yazılı kanun (Türkiye) · **Anglo-Sakson** emsal/içtihat (İngiltere, ABD).
- **Resepsiyon:** Medeni, Borçlar, İcra-İflas → İsviçre · Ceza → İtalya · Ticaret, CMK → Almanya.
- **TMK m.1:** kanun → örf-adet → hâkimin koyacağı kural; doktrin ve içtihattan yararlanır.
- Bağlayıcı içtihat istisnası: **AYM kararları** ve **Yargıtay İBK**.
- **Hiyerarşi:** Anayasa → kanun & antlaşma → CBK → yönetmelik → genelge/tebliğ. Temel haklarda antlaşma > kanun (AY 90). CBK–kanun çatışması → kanun.
- Örf-adet: maddi (tekrar) + manevi (hukuken zorunluluk inancı).
| Kural türü | İşaret
| Emredici | “olamaz, geçersizdir”; aykırılık kesin hükümsüz
| Tamamlayıcı | eksik konuyu doldurur; “aksi kararlaştırılmadıkça”
| Yorumlayıcı | belirsiz ifadeyi açıklar (“ay başı”)
| Tanımlayıcı | kavram tanımlar (ergin = 18)

| Hükümsüzlük | Ne zaman | Kim
| Yokluk | Kurucu unsur yok | Herkes, karara gerek yok
| Kesin hükümsüzlük | Emredici kural, ahlak, kamu düzeni, şekil | Herkes, hâkim re'sen, süresiz
| İptal edilebilirlik | Yanılma, aldatma, korkutma | Sadece mağdur, süreli
- **Kamu:** anayasa, idare, ceza, vergi, CMK, **medeni usul**, icra-iflas, devletler genel · **Özel:** medeni, borçlar, ticaret, devletler özel · **Karma:** iş, sosyal güvenlik.
- Mülkilik (ülke) · şahsilik (vatandaş). Yürürlük yazmıyorsa RG + 45 gün. Geriye yürümezlik; ceza hukukunda **lehe kanun geriye yürür**.
- Yorum: lafzi · tarihi (gerekçe) · sistematik (yer) · amaçsal (bugünkü amaç). Ceza hukukunda **aleyhe kıyas yasak**.
### Hak kavramı
- **Hak** = hukuk düzeninin tanıdığı ve koruduğu yetki. Teoriler: irade (Savigny), menfaat (Jhering), karma (Jellinek).
- **Kamu hakları:** negatif statü (dokunulmazlıklar) · pozitif statü (eğitim, sağlık) · aktif statü (seçme-seçilme).
- **Mutlak** (herkese karşı: mülkiyet, kişilik) ↔ **nisbi** (belli kişiye: alacak). **Malvarlığı** (devredilir, mirasla geçer) ↔ **kişi varlığı** (devredilemez).
- **Yenilik doğuran:** kurucu (önalım), değiştirici (seçim), bozucu (dönme, fesih, iptal).
- **Aslen** (sahiplenme) ↔ **devren** kazanma: külli (miras) / cüz'i (satış).
- **Zamanaşımı:** hak sürer, def'i gerekir · **hak düşürücü süre:** hak biter, hâkim re'sen bakar.
- TMK **m.2** dürüstlük ve hakkın kötüye kullanılması · **m.3** iyiniyet karinesi · **m.6** iddia eden ispatlar · ihkak-ı hak yasağı.
